function togglePago(id){
  const l=db.lanc.find(x=>x.id===id); if(!l)return;
  if(l.pago){l.pago=false;save();fecharMdl();render();return}
  const f=l.fixaId?db.fixas.find(x=>x.id===l.fixaId):null;
  if(f&&f.estimado){
    formModal('Confirmar valor',[{k:'valor',label:'Valor real pago',type:'money',v:fmt(l.valor)}],d=>{
      const v=parseMoney(d.valor); if(v<=0)return toast('Valor inválido');
      l.valor=v; l.pago=true; f.valor=v;  /* fixa estimada aprende o valor novo */
      save();fecharMdl();render();
    },'É uma conta fixa de valor estimado — o app guarda esse valor para o próximo mês.');
  }else{l.pago=true;save();fecharMdl();render()}
}
/* abre o formulário já preenchido com um lançamento parecido, só para trocar o valor.
   Numa compra parcelada repete a compra inteira, não uma parcela solta. */
function repetir(id){
  const l=db.lanc.find(x=>x.id===id); if(!l)return;
  const grupo=l.compraId?db.lanc.filter(x=>x.compraId===l.compraId):[l];
  const total=grupo.reduce((s,x)=>s+x.valor,0);
  /* o total devido fica todo na 1ª parcela, mas somar o grupo é o que vale aqui */
  const devido=(i)=>grupo.reduce((s,x)=>s+((devemDe(x)[i]||{}).total||0),0);
  novo={...novoVazio(),tipo:l.tipo,data:hoje(),desc:l.desc,valor:fmt(total),
    contaId:l.contaId,destId:l.destId||'',catId:l.catId||'',parcs:grupo.length,
    devem:!!devemDe(l).length,
    quem:devemDe(l).map((d,i)=>({pid:d.pid,valor:fmt(devido(i))}))};
  fecharMdl(); tab='lancar'; render();
  toast(grupo.length>1?`Repetindo a compra em ${grupo.length}x — confira`:'Confira o valor e salve');
}
/* trocar a conta depois de lançado. Tudo o que depende da conta (fatura, saldo,
   comprometido) é calculado na hora, então mover um lançamento se resolve sozinho —
   menos num ponto: fatura já paga. Tirar ou pôr item nela deixaria o pagamento maior
   que o total, e o cartão passaria a dever um valor negativo. Travado nos dois lados. */
function travaFatura(pares){
  for(const [cid,data] of pares){
    if(!isCartao(cid))continue;
    const ref=faturaRef(conta(cid),data);
    if(faturaPago(cid,ref)>0)
      return `A fatura de ${conta(cid).nome} de ${lblMes(ref)} já foi paga — desfaça o pagamento antes de mexer neste lançamento.`;
  }
  return '';
}
function editarLanc(id){
  const l=db.lanc.find(x=>x.id===id); if(!l)return;
  const grupo=l.compraId?db.lanc.filter(x=>x.compraId===l.compraId):[l];
  /* transferência tem duas contas; fatura e reembolso só caem em conta de verdade */
  const trocaConta=l.tipo!=='transf';
  const opcs=trocaConta?contasAtivas(l.tipo==='saida'||l.tipo==='entrada'):[];
  formModal('Editar lançamento',[
    {k:'desc',label:'Descrição',v:l.desc},
    {k:'valor',label:'Valor',type:'money',v:fmt(l.valor)},
    {k:'data',label:'Data',type:'date',v:l.data},
    ...(trocaConta?[{k:'contaId',label:l.tipo==='fatura'?'Pago com':'Conta',type:'select',opts:opcs,v:l.contaId}]:[]),
    ...(l.tipo==='transf'||l.tipo==='fatura'||l.tipo==='reemb'?[]:
      [{k:'catId',label:'Categoria',type:'select',opts:db.cats.filter(c=>!c.arq&&c.tipo===l.tipo),v:l.catId}]),
    ...(l.naoMeu>0&&!l.parcs?devemDe(l).map((dv,i)=>
        ({k:'dev'+i,label:`Quanto ${nomePessoa(dv.pid)} te deve`,type:'money',v:fmt(dv.total||0)})):[])
  ],d=>{
    const v=parseMoney(d.valor); if(v<=0)return toast('Valor inválido');
    if(d.dev0!==undefined){
      const novos=devemDe(l).map((dv,i)=>Math.max(0,parseMoney(d['dev'+i])));
      if(devemDe(l).some((dv,i)=>dv.cred!==dv.total&&novos[i]!==dv.total))
        return toast('Já recebeu parte disso — não dá para mudar o valor devido');
      if(novos.reduce((a,b)=>a+b,0)>v)return toast('As partes somam mais que o lançamento');
      devemDe(l).forEach((dv,i)=>{dv.total=novos[i];dv.cred=novos[i]});
      l.devem=devemDe(l).filter(dv=>dv.total>0);
      l.naoMeu=novos.reduce((a,b)=>a+b,0);
    }
    const trocou=d.contaId!==undefined&&d.contaId!==l.contaId;
    const mudouData=d.data!==l.data;
    if(trocou||mudouData){
      const dest=trocou?d.contaId:l.contaId, pares=[];
      /* trocar de conta move a compra inteira; mudar a data move só esta parcela */
      if(trocou)for(const x of grupo)pares.push([x.contaId,x.data],[dest,x.data]);
      if(mudouData)pares.push([l.contaId,l.data],[dest,d.data]);
      const erro=travaFatura(pares);
      if(erro)return toast(erro);
    }
    if(trocou){
      /* metade no cartão e metade no banco não é uma compra parcelada, é duas compras */
      for(const x of grupo){
        x.contaId=d.contaId;
        /* no cartão o dinheiro ainda não saiu da conta: nunca fica pendente */
        if(isCartao(d.contaId))x.pago=true;
      }
    }
    Object.assign(l,{desc:d.desc||l.desc,valor:v,data:d.data});
    if(d.catId!==undefined)l.catId=d.catId;
    save();fecharMdl();render();
  },[l.parcs>1?'Editar uma parcela não mexe nas outras nem no valor devido — só a troca de conta vale para a compra inteira.':'',
     trocaConta&&isCartao(l.contaId)?'Tirando do cartão, ele continua marcado como pago. Se ainda não pagou, use “Desmarcar pago” depois.':''
    ].filter(Boolean).join(' '));
}
function excluir(id){
  const l=db.lanc.find(x=>x.id===id); if(!l)return;
  const grupo=l.compraId?db.lanc.filter(x=>x.compraId===l.compraId):[l];
  if(grupo.some(x=>devemDe(x).some(d=>d.total>0&&d.total>d.cred))&&!confirm('Parte disso já foi recebida de volta. Excluir mesmo assim?'))return;
  if(!confirm(grupo.length>1?`Excluir a compra inteira (${grupo.length} parcelas)?`:'Excluir este lançamento?'))return;
  const ids=new Set(grupo.map(x=>x.id));
  db.lanc=db.lanc.filter(x=>!ids.has(x.id));
  save();fecharMdl();render();
  /* excluir era a única ação sem volta; agora dá para desfazer antes do aviso sumir */
  const copia=grupo.map(x=>({...x}));
  toast(grupo.length>1?`${grupo.length} parcelas excluídas`:'Lançamento excluído',
    {rotulo:'Desfazer',fn:()=>{
      const vivos=new Set(db.lanc.map(x=>x.id));
      db.lanc.push(...copia.filter(x=>!vivos.has(x.id)));
      save(); toast('Restaurado'); render();
    }});
}
function pagarFatura(cid,ref){
  const c=conta(cid), ab=faturaAberto(cid,ref);
  formModal(`Pagar fatura ${lblMes(ref)}`,[
    {k:'contaId',label:'Pagar com',type:'select',opts:contasAtivas(false),v:c.pagaId},
    {k:'data',label:'Data do pagamento',type:'date',v:hoje()}
  ],d=>{
    db.lanc.push({id:uid(),tipo:'fatura',data:d.data,desc:`Fatura ${c.nome} ${lblMes(ref)}`,
      valor:ab,contaId:d.contaId,destId:cid,faturaRef:ref,pago:true});
    save();fecharMdl();toast('Fatura paga');render();
  },`Valor: <b>${R(ab)}</b> (fatura inteira).`);
}
/* conferir item por item contra a fatura do banco, para achar cobrança que não é sua.
   A marca fica no lançamento, então dá para parar no meio e voltar depois. */
function verFatura(cid,ref){
  const it=faturaItens(cid,ref).sort((a,b)=>a.data<b.data?-1:1);
  const ok=it.filter(l=>l.conf), falta=it.filter(l=>!l.conf);
  const faltaR=falta.reduce((s,l)=>s+l.valor,0);
  $('#mdl').innerHTML=`<div class="mask" data-act="fora"><div class="mdl">
    <div class="grab"></div>
    <h3>Fatura ${lblMes(ref)} — ${esc(nomeConta(cid))}</h3>
    ${it.length?`<div class="sub">Conferidos ${ok.length} de ${it.length}${falta.length?` · faltam ${R(faltaR)}`:' · tudo conferido ✓'}</div>`:''}
    ${it.length?it.map(l=>`<div class="it"><input type="checkbox" data-conf="${l.id}" data-fat="${cid}|${ref}" ${l.conf?'checked':''}>
      <div class="l" style="flex:1;min-width:0"><div class="t" ${l.conf?'style="opacity:.55"':''}>${esc(l.desc)}${l.parcs>1?` <span class="tag k">${l.parc}/${l.parcs}</span>`:''}${nomesDevem(l).map(nm=>` <span class="tag e">${esc(nm)}</span>`).join('')}</div>
      <div class="sub">${dDia(l.data)}</div></div>
      <div class="v" ${l.conf?'style="opacity:.55"':''}>${R(l.valor)}</div></div>`).join('')
    :'<div class="empty">Fatura vazia.</div>'}
    <div class="row"><div class="l"><b>Total</b></div><div class="v neg">${R(faturaTotal(cid,ref))}</div></div>
    ${ok.length?`<button class="b gh" data-act="desconf|${cid}|${ref}">Desmarcar os conferidos</button>`:''}
    <div class="hint">Vá marcando cada linha conforme bate com a fatura do banco. O que sobrar sem marca é o que você não reconheceu.</div>
    <button class="b gh" data-act="fechar">Fechar</button></div></div>`;
}
function desconferir(cid,ref){
  faturaItens(cid,ref).forEach(l=>delete l.conf);
  save(); verFatura(cid,ref);
}

/* CSV para abrir no Excel: ponto e vírgula e vírgula decimal são o padrão pt-BR,
   e o BOM é o que faz o Excel não trocar os acentos por lixo. */
function exportarCSV(){
  const cel=v=>{const s=String(v??'');return /[;"\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;};
  const num=c=>(c/100).toFixed(2).replace('.',',');
  const cab=['Data','Tipo','Descrição','Categoria','Conta','Valor','Pago','Parcela','Quem deve','Valor devido'];
  const TIPO={saida:'Saída',entrada:'Entrada',transf:'Transferência',fatura:'Pagamento de fatura',
    reemb:'Recebimento',rend:'Rendimento'};
  const linhas=db.lanc.slice().sort((a,b)=>a.data<b.data?-1:1).map(l=>[
    l.data.split('-').reverse().join('/'),
    TIPO[l.tipo]||l.tipo,
    l.desc,
    l.catId&&cat(l.catId)?cat(l.catId).nome:'',
    nomeConta(l.contaId)+(l.destId?' → '+nomeConta(l.destId):''),
    num(l.valor),
    l.tipo==='saida'||l.tipo==='entrada'?(l.pago?'sim':'não'):'',
    l.parcs>1?`${l.parc}/${l.parcs}`:'',
    nomesDevem(l).join(', '),
    l.naoMeu?num(l.naoMeu):''
  ].map(cel).join(';'));
  const txt='﻿'+[cab.join(';'),...linhas].join('\r\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([txt],{type:'text/csv;charset=utf-8'}));
  a.download=`financeiro-${hoje()}.csv`;
  a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  toast(`${linhas.length} lançamentos exportados`);
}

/* ---- Google Drive ----
   O ID de cliente NÃO vive no código: o usuário cola nos Ajustes e ele fica no
   localStorage. Assim o repositório pode ser público sem carregar credencial.
   Escopo appdata: pasta escondida exclusiva deste app — ele não enxerga nenhum
   outro arquivo do Drive, mesmo autorizado.
   O token de acesso fica só em memória, nunca é salvo. */
const DRIVE_ESCOPO='https://www.googleapis.com/auth/drive.appdata';
const DRIVE_ARQ='financeiro.json';
let driveToken=null;
const qdo=ms=>new Date(ms).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'});
/* o Google exige origem https (ou localhost); por arquivo local não funciona */
const driveServe=()=>location.protocol==='https:'||location.hostname==='localhost';

function carregarGIS(){
  if(window.google&&google.accounts&&google.accounts.oauth2)return Promise.resolve();
  return new Promise((ok,err)=>{
    const s=document.createElement('script');
    s.src='https://accounts.google.com/gsi/client';
    s.onload=ok;
    s.onerror=()=>err(new Error('sem internet para falar com o Google'));
    document.head.appendChild(s);
  });
}
async function driveAuth(){
  if(!db.driveId)throw new Error('falta o ID de cliente nos Ajustes');
  if(driveToken&&driveToken.exp>Date.now())return driveToken.t;
  await carregarGIS();
  return new Promise((ok,err)=>{
    google.accounts.oauth2.initTokenClient({
      client_id:db.driveId, scope:DRIVE_ESCOPO,
      callback:r=>{
        if(r.error)return err(new Error(r.error));
        driveToken={t:r.access_token,exp:Date.now()+(r.expires_in-60)*1000};
        ok(r.access_token);
      },
      error_callback:e=>err(new Error(e&&e.type==='popup_closed'?'você fechou a janela do Google':'autorização negada'))
    }).requestAccessToken();
  });
}
const driveHead=tk=>({Authorization:'Bearer '+tk});
async function driveJson(r){
  if(!r.ok)throw new Error('o Drive respondeu '+r.status);
  return r.json();
}
async function driveArquivo(tk){
  const q=encodeURIComponent("name='"+DRIVE_ARQ+"'");
  const j=await driveJson(await fetch(
    `https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&fields=files(id,modifiedTime)&q=${q}`,
    {headers:driveHead(tk)}));
  return (j.files&&j.files[0])||null;
}
const driveBaixar=async(tk,id)=>driveJson(await fetch(
  `https://www.googleapis.com/drive/v3/files/${id}?alt=media`,{headers:driveHead(tk)}));
async function driveSubir(tk,id,dados){
  const corpo=new FormData();
  corpo.append('metadata',new Blob([JSON.stringify(
    id?{name:DRIVE_ARQ}:{name:DRIVE_ARQ,parents:['appDataFolder']})],{type:'application/json'}));
  corpo.append('file',new Blob([JSON.stringify(dados)],{type:'application/json'}));
  return driveJson(await fetch(
    `https://www.googleapis.com/upload/drive/v3/files/${id||''}?uploadType=multipart`,
    {method:id?'PATCH':'POST',headers:driveHead(tk),body:corpo}));
}
const resumo=d=>`${d&&d.sync?qdo(d.sync):'sem data'} · ${(d&&d.lanc&&d.lanc.length)||0} lançamentos`;

async function driveSalvar(){
  try{
    toast('Falando com o Drive…');
    const tk=await driveAuth();
    const f=await driveArquivo(tk);
    if(f){
      const remoto=await driveBaixar(tk,f.id).catch(()=>null);
      /* só avisa quando sobrescrever pode custar caro: o Drive está na frente */
      if(remoto&&remoto.sync&&(!db.sync||remoto.sync>db.sync)&&
         !confirm(`A cópia do Drive é MAIS NOVA que a deste aparelho.\n\n`+
                  `Drive: ${resumo(remoto)}\nAqui: ${resumo(db)}\n\n`+
                  `Salvar vai substituir a do Drive. Continuar?`))return toast('Cancelado');
    }
    const carimbo=Date.now();
    await driveSubir(tk,f&&f.id,{...db,sync:carimbo,backup:carimbo});
    db.sync=carimbo; db.backup=carimbo; save();
    toast('Salvo no Drive'); render();
  }catch(e){toast('Não deu: '+e.message)}
}
async function driveCarregar(){
  try{
    toast('Falando com o Drive…');
    const tk=await driveAuth();
    const f=await driveArquivo(tk);
    if(!f)return toast('Ainda não há backup no Drive');
    const d=await driveBaixar(tk,f.id);
    if(!d||!Array.isArray(d.contas))return toast('O arquivo do Drive não parece um backup deste app');
    const velho=d.sync&&db.sync&&d.sync<db.sync;
    if(!confirm(`${velho?'⚠️ A cópia do Drive é MAIS VELHA que a deste aparelho.\n\n':''}`+
                `Isto APAGA os dados deste aparelho e põe os do Drive no lugar.\n\n`+
                `Drive: ${resumo(d)}\nAqui: ${resumo(db)}\n\nContinuar?`))return toast('Cancelado');
    const idLocal=db.driveId;
    db=d;
    for(const k of ['contas','cats','fixas','lanc','pessoas'])if(!Array.isArray(db[k]))db[k]=[];
    if(!db.orc)db.orc={};
    if(!db.driveId)db.driveId=idLocal;   /* não se tranca para fora da própria sincronização */
    migrar(); save(); gerarFixas();
    toast('Carregado do Drive'); tab='inicio'; mes=mesDe(hoje()); render();
  }catch(e){toast('Não deu: '+e.message)}
}
function salvarDriveId(v){
  /* o formato real é 000000000000-xxxxxxxx.apps.googleusercontent.com.
     Colar pela metade é a causa mais comum do "401 invalid_client". */
  const id=(v||'').trim().replace(/\s/g,'');
  if(id&&!/\.apps\.googleusercontent\.com$/.test(id))
    return toast('O ID termina em .apps.googleusercontent.com');
  if(id&&!/^\d{6,}-[a-z0-9]{8,}\.apps\.googleusercontent\.com$/.test(id))
    return toast('Parece incompleto: falta a parte antes do hífen ou depois dele');
  db.driveId=id||null; driveToken=null; save(); render();
  toast(id?'ID guardado neste aparelho':'ID removido');
}

/* ---- backup ---- */
function exportar(){
  db.backup=Date.now(); save();
  const b=new Blob([JSON.stringify(db)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(b);
  a.download=`financeiro-${hoje()}.json`;
  a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  toast('Backup exportado'); render();
}
function importar(file){
  const r=new FileReader();
  r.onload=()=>{
    let d; try{d=JSON.parse(r.result)}catch(e){return toast('Arquivo inválido')}
    if(!d||!Array.isArray(d.contas))return toast('Não parece um backup deste app');
    if(!confirm(`Isso APAGA os dados deste aparelho e coloca os do arquivo (${d.lanc?.length||0} lançamentos). Continuar?`))return;
    db=d; for(const k of ['contas','cats','fixas','lanc'])if(!Array.isArray(db[k]))db[k]=[];
    if(!db.orc)db.orc={};
    save(); toast('Backup importado'); render();
  };
  r.readAsText(file);
}

const VIEWS={inicio:vInicio,lancar:vLancar,extrato:vExtrato,cartoes:vCartoes,
  carteira:vCarteira,orcamento:vOrcamento,relatorio:vRelatorio,config:vConfig};

/* ============ eventos ============ */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-tab],[data-tp],[data-fl],[data-act],[data-lanc],[data-ed],[data-pagfat],[data-vfat],[data-desistir],[data-mes],[data-selp],[data-atual],[data-apor],[data-resg],[data-drill],[data-ir],[data-irmes],[data-info]');
  if(!t)return;
  const d=t.dataset;
  /* tocar numa marca do gráfico escreve o valor na linha de leitura do cartão */
  if(d.info!==undefined){
    const l=t.closest('.c')?.querySelector('.lida');
    if(l)l.textContent=d.info;
    return;
  }
  /* a busca não sobrevive à troca de tela: voltar ao extrato e ver outros meses confunde */
  if(d.tab){fecharMdl();busca='';selExt.clear();tab=d.tab;render();return}
  if(d.tp){novo.tipo=d.tp;novo.catId='';render();return}
  if(d.fl){filtro=d.fl;selExt.clear();render();return}
  if(d.mes){mes=d.mes;tab='extrato';render();return}
  if(d.desistir!==undefined&&d.desistir){desistir(d.desistir);return}
  if(d.selp){dividas(x=>x.d.pid===d.selp).forEach(x=>sel.add(chaveDiv(x)));render();return}
  if(d.atual){atualizarValor(d.atual);return}
  if(d.drill){verCategoria(d.drill);return}
  if(d.apor){moverAplicacao(d.apor,true);return}
  if(d.resg){moverAplicacao(d.resg,false);return}
  if(d.irmes){fecharMdl();mes=d.irmes;anoSel=null;render();return}
  /* linha do resumo leva até a seção correspondente na mesma tela */
  if(d.ir){
    const alvo=[...document.querySelectorAll('#view .c > h2')]
      .find(h=>h.textContent===(d.ir==='inv'?'Investimentos':'Me devem'));
    alvo?.closest('.c').scrollIntoView({behavior:'smooth',block:'start'});
    return;
  }
  if(d.lanc){abrirLanc(d.lanc);return}
  if(d.ed!==undefined){const[tp,id]=d.ed.split('|');editar(tp,id);return}
  if(d.pagfat){const[c,r]=d.pagfat.split('|');pagarFatura(c,r);return}
  if(d.vfat){const[c,r]=d.vfat.split('|');verFatura(c,r);return}
  const[a,arg]=(d.act||'').split('|');
  switch(a){
    case 'mes-':mes=addMes(mes,-1);render();break;
    case 'selmes':anoSel=+mes.slice(0,4);seletorMes();break;
    case 'ano-':anoSel=(anoSel??+mes.slice(0,4))-1;seletorMes();break;
    case 'ano+':anoSel=(anoSel??+mes.slice(0,4))+1;seletorMes();break;
    case 'mes+':mes=addMes(mes,1);render();break;
    case 'salvar':salvar();break;
    case 'quem-add':(novo.quem=novo.quem||[]).push({pid:pessoasAtivas()[0]?.id||'',valor:''});render();break;
    case 'quem-del':novo.quem.splice(+arg,1);render();break;
    case 'quem-igual':{
      /* rachar a conta: você e as pessoas listadas, em partes exatas de centavo */
      const v=parseMoney(novo.valor);
      if(!v){toast('Informe o valor primeiro');break}
      const p=divide(v,novo.quem.length+1);
      novo.quem.forEach((q,i)=>q.valor=fmt(p[i+1]));
      render();break;
    }
    case 'fechar':fecharMdl();break;
    /* clique no fundo escuro fecha; clique dentro da caixa, não.
       não dá para usar stopPropagation aqui: mataria o clique de todo botão do modal */
    case 'fora':if(e.target.classList.contains('mask'))fecharMdl();break;
    case 'mdl-ok':mdlSave&&mdlSave();break;
    case 'pago':togglePago(arg);break;
    case 'repetir':repetir(arg);break;
    case 'selx-tudo':filtraExtrato().forEach(l=>selExt.add(l.id));$('#lista').innerHTML=listaExtrato();break;
    case 'selx-nada':selExt.clear();$('#lista').innerHTML=listaExtrato();break;
    case 'baixar':baixarSelecionados();break;
    case 'export-csv':exportarCSV();break;
    case 'excluir-cad':{const[tp,cid]=(d.act||'').split('|').slice(1);excluirCad(tp,cid);break;}
    case 'desconf':{const[c,r]=(d.act||'').split('|').slice(1);desconferir(c,r);break;}
    case 'editar-lanc':editarLanc(arg);break;
    case 'excluir':excluir(arg);break;
    case 'sel-emp':dividas(daEmpresa).forEach(x=>sel.add(chaveDiv(x)));render();break;
    case 'sel-nada':sel.clear();render();break;
    case 'copiar':copiarLista();break;
    case 'reembolso':registrarReembolso();break;
    case 'drive-id':salvarDriveId($('#driveId').value);break;
    case 'drive-salvar':driveSalvar();break;
    case 'drive-carregar':driveCarregar();break;
    case 'export':exportar();break;
    case 'import':$('#fimp').click();break;
    case 'zerar':
      if(confirm('Apagar TUDO deste aparelho? Não tem como voltar atrás sem um backup.')&&
         confirm('Confirma mesmo? Todos os lançamentos serão perdidos.')){
        db=novoDb();save();tab='inicio';render();toast('Zerado');
      }break;
  }
});

  if(el.dataset.selx){el.checked?selExt.add(el.dataset.selx):selExt.delete(el.dataset.selx);

  ok(/de qualquer mês/.test($('#lista').innerHTML),'e o cabeçalho avisa que saiu do mês');
  ok(/ATRASADOS|Atrasados/.test($('#lista').innerHTML),'agrupado por urgência');
  filtro='todos'; render();
  ok(/lançamento\(s\) em /.test($('#lista').innerHTML),'os outros filtros seguem presos ao mês');

  /* relatório: comparação, abrir a categoria e filtro por conta */
  mes='2026-01'; contaRel=''; tab='relatorio'; render();
  ok(/que em dez\/2025/.test($('#view').innerHTML),'compara com o mês anterior');
  const algumaCat=catsMes('2026-01')[0];
  if(algumaCat){
    clk(`[data-drill="${algumaCat[0]}"]`);
    ok(!!document.querySelector('.mdl')&&/lançamento\(s\)/.test($('#mdl').innerHTML),
       'tocar na categoria abre os lançamentos que formam o valor');
    fecharMdl();
  }
  contaRel='C'; render();
  ok(/Cartão não tem saldo/.test($('#view').innerHTML),'com cartão escolhido, o gráfico de saldo diz que não se aplica');
  contaRel='B'; render();
  ok(document.querySelectorAll('.viz .c').length===4,'com conta escolhida, os quatro gráficos continuam');
  contaRel=''; render();

  /* lançar em sequência: fica na tela, com o Salvar sempre alcançável */
  tab='lancar'; novo={...novoVazio(),contaId:'B',valor:'100,00',desc:'Teste seq',catId:cm}; render();
  const qtdAntes=db.lanc.length;
  clk('[data-act="salvar"]');
  ok(db.lanc.length===qtdAntes+1,'salvou');
  ok(tab==='lancar','continua em Lançar, não vai para o extrato');
  ok(novo.valor===''&&novo.desc===''&&novo.contaId==='B','formulário limpo, conta mantida');
  ok(!!document.querySelector('.toast .tacao'),'o aviso traz o atalho para conferir');
  window.scrollTo(0,0);
  const btSalvar=document.querySelector('[data-act="salvar"]').getBoundingClientRect();
  const sobBotao=document.elementFromPoint(btSalvar.left+btSalvar.width/2,btSalvar.top+btSalvar.height/2);
  ok(sobBotao&&sobBotao.closest('[data-act="salvar"]'),
     'o toque no Salvar chega no Salvar: nem a barra nem o aviso ficam na frente');
  ok(btSalvar.bottom<=document.querySelector('#bar').getBoundingClientRect().top+1,
     'e ele não passa por baixo da barra');

  /* a tela de lançar abre com o cursor no valor */
  novo={...novoVazio(),contaId:'B'}; tab='lancar'; render();
  ok(document.activeElement===$('[data-f="valor"]'),'cursor já no valor');
  novo={...novoVazio(),contaId:'B',valor:'10,00'}; render();
  ok(document.activeElement!==$('[data-f="valor"]'),'com valor digitado não rouba o foco');

  /* excluir deixa de ser sem volta */
  const vitima=db.lanc.find(l=>l.desc==='Posto Shell');
  const antesDel=db.lanc.length, saldoDel=saldo('B');
  const confOrig=window.confirm; window.confirm=()=>true;
  excluir(vitima.id);
  ok(db.lanc.length===antesDel-1,'excluiu');
  ok($('.toast .tacao'),'o aviso traz o botão Desfazer');
  clk('.toast .tacao');
  window.confirm=confOrig;
  ok(db.lanc.length===antesDel&&saldo('B')===saldoDel,'desfazer devolve o lançamento e o saldo');
  ok(db.lanc.filter(l=>l.id===vitima.id).length===1,'sem duplicar');

  /* pular direto para um mês */
  tab='inicio'; mes='2026-01'; render();
  clk('[data-act="selmes"]');
  ok(document.querySelectorAll('[data-irmes]').length>=12,'a grade traz os 12 meses');
  clk('[data-irmes="2026-02"]');
  ok(mes==='2026-02'&&!document.querySelector('.mdl'),'pula para o mês e fecha');

  /* o extrato soma o que está na tela, com ou sem busca */
  tab='extrato'; busca=''; filtro='todos'; mes='2026-01'; render();
  ok(/lançamento\(s\) em jan\/2026/.test($('#lista').innerHTML),'conta os lançamentos do mês sem busca');

  /* baixa em lote: o ritual de fim de mês */
  mes=mesDe(hoje()); busca=''; filtro='pend'; selExt.clear(); tab='extrato'; render();
  const pend=document.querySelectorAll('[data-selx]').length;
  if(pend){
    clk('[data-act="selx-tudo"]');
    ok(selExt.size===pend,'“Marcar todas” pega todos os pendentes');
    const antes=saldo('B'), baixados=filtraExtrato().filter(l=>selExt.has(l.id));
    const efeito=baixados.reduce((s,l)=>s+(l.tipo==='entrada'?l.valor:-l.valor),0);
    clk('[data-act="baixar"]');
    ok(baixados.every(l=>l.pago),'todos viraram pagos');
    ok(saldo('B')===antes+efeito,'o saldo mudou exatamente o que foi baixado');
    ok(selExt.size===0,'a seleção se limpa depois da baixa');
  }

  /* conferência da fatura: marca gravada, dá para parar no meio */
  const refConf=faturaRef(conta('C'),'2026-01-20');
  verFatura('C',refConf);
  const itensFat=document.querySelectorAll('[data-conf]').length;
  ok(itensFat>0,'a fatura abre com caixas de conferência');
  ok(/Conferidos 0 de /.test($('#mdl').innerHTML),'placar começa zerado');
  let marcados=0;
  while(document.querySelector('[data-conf]:not(:checked)')&&marcados<60){
    const e=document.querySelector('[data-conf]:not(:checked)');
    e.checked=true; e.dispatchEvent(new Event('change',{bubbles:true})); marcados++;
  }
  ok(marcados===itensFat&&/tudo conferido/.test($('#mdl').innerHTML),'conferindo tudo, o placar fecha');
  ok(faturaItens('C',refConf).every(l=>l.conf===true),'a marca fica gravada no lançamento');
  clk('[data-act^="desconf"]');
  ok(faturaItens('C',refConf).every(l=>l.conf===undefined),'desmarcar limpa para o mês seguinte');
  fecharMdl();

  /* CSV: o Excel brasileiro quer ponto e vírgula, vírgula decimal e BOM */
  let csvBlob=null;
  const oCreate=document.createElement.bind(document), oURL=URL.createObjectURL;
  document.createElement=t=>{const e=oCreate(t); if(t==='a')e.click=function(){}; return e;};
  URL.createObjectURL=b=>{csvBlob=b; return 'blob:teste';};
  exportarCSV();
  document.createElement=oCreate; URL.createObjectURL=oURL;
  ok(!!csvBlob,'o CSV foi gerado');

  /* repetir traz a compra inteira, não uma parcela solta */
  const g1=db.lanc.find(l=>l.desc==='Geladeira'&&l.parc===2);
  repetir(g1.id);
  ok(tab==='lancar'&&novo.desc==='Geladeira','abre o formulário preenchido');
  ok(novo.valor===fmt(300000)&&novo.parcs===3,'repete o total e as 3 parcelas, não os 1.000 da parcela');
  ok(novo.data===hoje(),'com a data de hoje');

  /* investimentos: aplicação é conta, aporte é transferência */
  db.contas.push({id:'I',nome:'CDB',tipo:'invest',subtipo:'CDB',saldoInicial:0,arq:false});
  const dispAntes=saldoTotal(), patAntes=patrimonio();
  /* março já tem a parcela da geladeira: o que importa é que o aporte não SOME nada */
  const gMar=somaMeu(gastosMes('2026-03')), rMar=soma(receitasMes('2026-03'));
  novo={...novoVazio(),tipo:'transf',data:'2026-03-01',desc:'Aporte',valor:'2.000,00',contaId:'B',destId:'I'};
  salvar();
  ok(saldo('I')===200000,'aporte entra na aplicação');
  ok(saldoTotal()===dispAntes-200000,'aporte sai do saldo disponível');
  ok(patrimonio()===patAntes,'aporte não muda o patrimônio — o dinheiro só mudou de lugar');
  ok(somaMeu(gastosMes('2026-03'))===gMar&&soma(receitasMes('2026-03'))===rMar,'aporte não é gasto nem receita');
  ok(saldoDia('2026-03-01')===saldoDia('2026-02-28')-200000,'saldoDia enxerga o aporte saindo do disponível');
  db.lanc.push({id:uid(),tipo:'rend',data:'2026-04-01',valor:15000,contaId:'I',pago:true,desc:'Rendimento'});
  ok(rendimento('I')===15000&&aportado('I')===200000,'rendimento separado do aporte');
  ok(soma(receitasMes('2026-04'))===0,'rendimento não conta como receita');
  ok(saldoTotal()===dispAntes-200000,'rendimento não mexe no disponível');
  ok(patrimonio()===patAntes+15000,'rendimento sobe o patrimônio');
  db.lanc.push({id:uid(),tipo:'rend',data:'2026-05-01',valor:-4000,contaId:'I',pago:true,desc:'Perda'});
  ok(saldo('I')===211000&&rendimento('I')===11000,'perda também entra');
  ok(!contasAtivas(true).some(c=>c.tipo==='invest'),'aplicação não aparece para lançar despesa');
  ok(contasAtivas(false,true).some(c=>c.tipo==='invest'),'mas aparece na transferência');
  tab='carteira'; render();
  ok(/CDB/.test($('#view').innerHTML),'tela de investimentos lista a aplicação');

  /* reserva programada: meta, quanto guardar por mês e o que ela faz no orçamento */
  const tr=db.cats.find(x=>x.nome==='Transporte').id;
  const RS={id:'RS',nome:'Reserva do carro',tipo:'invest',subtipo:'CDB',saldoInicial:60000,
    arq:false,meta:180000,metaData:addMesData(hoje(),3),metaDesc:'IPVA',metaCat:tr};
  db.contas.push(RS);
  let mt=metaReserva(RS);
  ok(mt.tem===60000&&mt.falta===120000&&mt.pc===33,'a meta sabe o que já tem e o que falta');
  ok(mt.meses===3&&mt.porMes===40000,'divide o que falta pelos meses que sobram');
  RS.metaData=addMesData(hoje(),2);
  ok(metaReserva(RS).porMes===60000,'perdeu um mês, o valor mensal sobe sozinho');
  RS.metaData='2020-01-10';
  mt=metaReserva(RS);
  ok(mt.venceu&&mt.porMes===120000,'prazo vencido: guarde tudo, não há o que diluir');
  RS.saldoInicial=180000;
  ok(metaReserva(RS).pronta&&metaReserva(RS).porMes===0,'meta alcançada não pede mais nada');
  ok(metaReserva(conta('I'))===null,'aplicação sem meta não vira reserva');

  /* o gasto continua no mês em que foi pago; a reserva só explica de onde veio */
  RS.metaData=addMesData(hoje(),3); RS.saldoInicial=180000;
  const ymR=mesDe(hoje());
  ok(saiuDaReserva(tr,ymR)===null,'sem resgate no mês, nada a explicar');
  db.lanc.push({id:uid(),tipo:'transf',data:hoje(),desc:'Resgate IPVA',valor:180000,contaId:'RS',destId:'B',pago:true});
  db.lanc.push({id:uid(),tipo:'saida',data:hoje(),desc:'IPVA',valor:180000,contaId:'B',catId:tr,pago:true});
  const rs=saiuDaReserva(tr,ymR);
  ok(rs&&rs.v===180000&&rs.nome==='Reserva do carro','o orçamento mostra quanto saiu da reserva');
  ok(somaMeu(gastosMes(ymR).filter(l=>l.catId===tr))===180000,
     'o IPVA conta como gasto no mês em que foi pago, não diluído');
  ok(emUso('cat',tr)==='tem lançamentos','categoria de reserva não some por engano');
  tab='carteira'; render();
  const txtRes=$('#view').innerText;
  ok(txtRes.includes('guarde '+R(metaReserva(RS).porMes)+'/mês'),'a tela diz quanto guardar por mês');
  const blocoRes=(txtRes.split('Reserva do carro')[1]||'').split('+ Nova aplicação')[0];
  ok(blocoRes&&!blocoRes.includes('nunca atualizado'),
     'reserva não cobra "atualizar valor": o saldo dela é o que você guardou');
  clk('[data-apor="RS"]');
  ok($('#mf_valor').value===fmt(metaReserva(RS).porMes)||metaReserva(RS).pronta,
     'Guardar já vem com o valor do mês preenchido');
  clk('.mdl [data-act="fechar"]');
  /* a Carteira abre o "Em conta" conta por conta, e a soma tem de bater com o total */
  const det=[...document.querySelectorAll('.det .row')];
  ok(det.length===db.contas.filter(c=>ehGasto(c)&&!c.arq).length,'uma linha por conta de gasto');
  ok(/Banco/.test($('#view').innerHTML)&&/Dinheiro/.test($('#view').innerHTML),'cada conta aparece pelo nome');
  ok(det.map(r=>parseMoney(r.querySelector('.v').textContent)).reduce((a,b)=>a+b,0)===saldoTotal(),
     'as contas somam exatamente o "Em conta"');
  ok(!document.querySelector('.det .row .v').textContent.includes('undefined'),'cada linha traz o saldo');

  /* previsão de reembolso: vem do rito da pessoa, não de data digitada por compra */
  const EMP2=db.pessoas.find(p=>p.empresa);
  EMP2.diaPaga=5; EMP2.mesPaga='seguinte';
  const umaCompra={id:uid(),tipo:'saida',data:'2026-01-20',desc:'Material',valor:90000,
    contaId:'B',catId:cm,pago:true,naoMeu:90000,devem:[{pid:EMP2.id,cred:90000,total:90000}]};
  db.lanc.push(umaCompra);
  ok(previsaoReceb(umaCompra,EMP2.id)==='2026-02-05','compra de janeiro cai no dia 5 de fevereiro');
  EMP2.mesPaga='mesmo';
  ok(previsaoReceb(umaCompra,EMP2.id)==='2026-02-05','"mesmo mês" com o dia já passado empurra para o mês seguinte');
  umaCompra.data='2026-01-02';
  ok(previsaoReceb(umaCompra,EMP2.id)==='2026-01-05','"mesmo mês" com o dia ainda por vir fica no mês');
  EMP2.diaPaga=31; EMP2.mesPaga='seguinte'; umaCompra.data='2026-01-10';
  ok(previsaoReceb(umaCompra,EMP2.id)==='2026-02-28','dia 31 vira o último dia de um mês curto');
  delete EMP2.diaPaga;
  ok(previsaoReceb(umaCompra,EMP2.id)==='','sem dia cadastrado não inventa previsão');

  /* o que ainda não venceu entra no previsto; atrasado não */
  EMP2.diaPaga=5; EMP2.mesPaga='seguinte';
  umaCompra.data=hoje();
  const venceDepois=previsaoReceb(umaCompra,EMP2.id);
  ok(venceDepois>hoje(),'a previsão de uma compra de hoje está no futuro');
  ok(receberAte(venceDepois)===90000,'reembolso a vencer entra no saldo previsto');
  ok(receberAte(hoje())===0,'e não entra antes da data prevista');
  const antesDoAtraso=receberAte('2099-12-31');
  umaCompra.data='2020-01-10';
  ok(receberAte('2099-12-31')===antesDoAtraso-90000,'reembolso atrasado sai do previsto: prazo vencido não é dinheiro no bolso');
  umaCompra.data=hoje();
  /* cabeçalho e gráfico têm de contar a mesma coisa */
  /* isolar o efeito: ligar e desligar o rito, tudo o mais igual.
     comparar com saldoDia(hoje) não serviria — no meio entram contas a vencer */
  const fimLonge=addMesData(hoje(),2).slice(0,7)+'-28';
  const ymL=fimLonge.slice(0,7), fimReal=`${ymL}-${p2(ultDia(+ymL.slice(0,4),+ymL.slice(5,7)))}`;
  const esperado=receberAte(fimLonge), comRito=saldoDia(fimLonge);
  const espMes=receberAte(fimReal), pvCom=previsto(ymL);
  delete EMP2.diaPaga;
  ok(esperado>0&&comRito-saldoDia(fimLonge)===esperado,'saldoDia soma exatamente o reembolso previsto');
  /* previsto() e saldoDia() nunca deram o mesmo número (regras diferentes de propósito),
     mas o pedaço do reembolso tem de ser o mesmo nos dois — é a mesma fonte */
  ok(espMes>0&&pvCom-previsto(ymL)===espMes,'o cabeçalho conta a mesma previsão de reembolso que o gráfico');
  EMP2.diaPaga=5;
  umaCompra.devem[0].cred=0;

  /* trocar a conta de um lançamento depois de lançado */
  db=novoDb();
  db.contas.push({id:'B',nome:'Banco',tipo:'banco',saldoInicial:500000,arq:false},
    {id:'B2',nome:'Carteira',tipo:'dinheiro',saldoInicial:0,arq:false},
    {id:'C',nome:'Visa',tipo:'cartao',fechamento:28,vencimento:5,pagaId:'B',limite:1000000,arq:false,saldoInicial:0});
  const cmE=db.cats.find(x=>x.nome==='Mercado').id;
  const lancE=(o)=>{novo={...novoVazio(),tipo:'saida',catId:cmE,pago:true,desc:'x',...o};salvar()};
  tab='lancar';
  lancE({data:'2026-05-10',desc:'Mercado',valor:'200,00',contaId:'B'});
  const gastoE=db.lanc.find(x=>x.desc==='Mercado');
  const saldoAntesE=saldo('B');
  editarLanc(gastoE.id);
  ok(!!document.querySelector('#mf_contaId'),'o editar agora traz a conta');
  campo('#mf_contaId','B2'); clk('[data-act="mdl-ok"]');
  ok(gastoE.contaId==='B2'&&saldo('B')===saldoAntesE+20000&&saldo('B2')===-20000,
     'trocar a conta devolve o dinheiro para uma e tira da outra');

  /* banco -> cartão: sai do saldo e entra na fatura */
  editarLanc(gastoE.id); campo('#mf_contaId','C'); clk('[data-act="mdl-ok"]');
  ok(gastoE.pago===true&&saldo('B2')===0,'no cartão não sai da conta, e nunca fica pendente');
  ok(faturaTotal('C',faturaRef(conta('C'),gastoE.data))===20000,'e entra na fatura do mês certo');

  /* parcelada: a compra inteira muda junto */
  lancE({data:'2026-06-10',desc:'Geladeira',valor:'900,00',contaId:'C',parcs:3});
  const gel=db.lanc.filter(x=>x.desc==='Geladeira');
  ok(gel.length===3&&gel.every(x=>x.contaId==='C'),'três parcelas no cartão');
  editarLanc(gel[0].id); campo('#mf_contaId','B'); clk('[data-act="mdl-ok"]');
  ok(gel.every(x=>x.contaId==='B'),'trocar a conta de uma parcela leva a compra inteira');

  /* fatura paga tranca os dois lados */
  lancE({data:'2026-07-10',desc:'Posto',valor:'150,00',contaId:'C'});
  const posto=db.lanc.find(x=>x.desc==='Posto'), refP=faturaRef(conta('C'),posto.data);
  db.lanc.push({id:uid(),tipo:'fatura',data:'2026-08-05',desc:'f',valor:faturaAberto('C',refP),
    contaId:'B',destId:'C',faturaRef:refP,pago:true});
  ok(faturaAberto('C',refP)===0,'fatura quitada');
  editarLanc(posto.id); campo('#mf_contaId','B'); clk('[data-act="mdl-ok"]');
  ok(posto.contaId==='C'&&!!document.querySelector('.mdl'),'não deixa tirar item de fatura já paga');
  clk('.mdl [data-act="fechar"]');
  ok(faturaAberto('C',refP)===0,'e a fatura paga continua fechando em zero');
  /* mudar a data também mudaria de fatura: mesma trava */
  editarLanc(posto.id); campo('#mf_data','2026-09-10'); clk('[data-act="mdl-ok"]');
  ok(posto.data==='2026-07-10','mudar a data de item em fatura paga também é recusado');
  clk('.mdl [data-act="fechar"]');

  if(real)localStorage.setItem(K,real); else localStorage.removeItem(K);
  load(); tab='inicio'; mes=mesDe(hoje()); novo.parcs=1; render();
  console.log('%cTodos os testes passaram','color:#16a34a;font-weight:bold');
}
</script>
</body>
</html>
