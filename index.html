<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- o manifesto é o que faz o Chrome do Android INSTALAR de verdade;
     sem ele "adicionar à tela inicial" cria só um atalho de navegador -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- combina com o topo da faixa colorida, para a barra de status não destoar -->
<meta name="theme-color" content="#06301f" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#06251a" media="(prefers-color-scheme: dark)">
<title>Controle Financeiro</title>
<style>
:root{
  --bg:#f2f3f6; --card:#fff; --tx:#14171c; --mut:#71787f; --bd:#e6e8ec; --bd2:#eef0f3;
  --ac:#0f5f43; --acBtn:#0f5f43; --ok:#0f8a4d; --no:#d92d20; --wn:#b45309; --emp:#6d28d9;
  --wnbg:#fef4e2; --empbg:#f2edff;
  --sh:0 3px 14px rgba(16,24,40,.09); --cbd:transparent;
  --topo:linear-gradient(150deg,#06301f,#0f5f43 55%,#17855d);
}
@media(prefers-color-scheme:dark){:root{
  --bg:#0f1216; --card:#181c22; --tx:#eceef1; --mut:#8b939d; --bd:#252b33; --bd2:#20262d;
  --ac:#4cc295; --acBtn:#1a7d59; --ok:#3ecf7f; --no:#ff6b60; --wn:#f5b544; --emp:#b18bff;
  --wnbg:#33270f; --empbg:#241d3a;
  --sh:none; --cbd:var(--bd);
  --topo:linear-gradient(150deg,#06251a,#0c3d2c 55%,#114f38);
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
/* os cards sobem por cima da curva da faixa colorida */
.wrap{max-width:860px;margin:-30px auto 0;padding:0 14px calc(104px + env(safe-area-inset-bottom));position:relative;z-index:1}

header{background:var(--topo);color:#fff;border-radius:0 0 26px 26px;
 padding:calc(14px + env(safe-area-inset-top)) 0 44px}
header.curto{padding-bottom:40px}
.hd{max-width:860px;margin:0 auto;padding:0 16px}
.hdtop{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:34px}
.hdtop h1{font-size:17px;margin:0;font-weight:700;letter-spacing:-.3px}
.mes{display:flex;align-items:center;background:rgba(255,255,255,.16);border-radius:10px}
.mes b{font-size:13px;min-width:74px;text-align:center;font-weight:650;letter-spacing:-.1px;color:#fff}
.mes button{background:none;border:0;color:rgba(255,255,255,.85);font-size:16px;padding:7px 11px;cursor:pointer;line-height:1}
.mes button:active{color:#fff}
/* ajustes é raro: vive numa engrenagem no cabeçalho, não ocupa vaga na barra */
.eng{background:rgba(255,255,255,.16);border:0;border-radius:10px;padding:7px;line-height:0;cursor:pointer;flex:0 0 auto}
.eng svg{width:18px;height:18px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
.eng.on svg{opacity:1}

/* barra de navegação fixa embaixo — no desktop vira uma ilha flutuante */
#bar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;gap:1px;
 background:var(--card);border-top:1px solid var(--bd);
 padding:7px 6px calc(9px + env(safe-area-inset-bottom))}
/* tablet: ilha flutuante. A partir de 900px há espaço para a coluna lateral. */
@media(min-width:640px) and (max-width:899px){#bar{max-width:440px;margin:0 auto;bottom:18px;border:1px solid var(--bd);border-radius:20px;box-shadow:0 10px 34px rgba(16,24,40,.16)}}
#bar .longo{display:none}
/* min-width:0 senão o rótulo mais longo dita a largura e os ícones desalinham */
#bar button{flex:1 1 0;min-width:0;max-width:92px;background:none;border:0;color:var(--mut);cursor:pointer;border-radius:12px;
 display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0;font:650 9px/1 inherit;letter-spacing:-.1px;position:relative}
#bar button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#bar button.on{color:var(--ac)}
#bar svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
/* sem rótulo embaixo, precisa centralizar sozinho — os outros botões são preenchidos pelo texto */
#bar .add{background:var(--acBtn);color:#fff;max-width:48px;border-radius:15px;margin:-2px 3px 0;
 justify-content:center;padding:6px;box-shadow:0 4px 12px rgba(15,95,67,.4)}
#bar .add svg{stroke-width:2.4}
#bar .add:active{transform:scale(.94)}
#bar .dot{position:absolute;top:4px;right:calc(50% - 16px);width:7px;height:7px;border-radius:50%;background:var(--emp)}

/* ---- PC: a barra vira coluna à esquerda ----
   Numa tela grande a barra no rodapé desperdiça a largura e deixa o olho longe
   do conteúdo. Aqui cabe o nome por extenso, sem os rótulos curtos do celular. */
@media(min-width:900px){
  body{padding-left:216px}
  #bar{top:0;bottom:0;right:auto;width:216px;max-width:none;margin:0;border-radius:0;box-shadow:none;
   flex-direction:column;justify-content:flex-start;align-items:stretch;gap:2px;
   border-top:0;border-right:1px solid var(--bd);padding:16px 12px;overflow-y:auto}
  #bar button{flex:0 0 auto;width:100%;max-width:none;flex-direction:row;justify-content:flex-start;
   gap:13px;padding:11px 12px;font-size:13.5px;letter-spacing:0}
  #bar button.on{background:var(--bg)}
  #bar button span{max-width:none;overflow:visible}
  #bar .curto{display:none}
  #bar .longo{display:inline}
  #bar .add{order:-1;max-width:none;margin:0 0 12px;border-radius:12px;padding:12px;
   flex-direction:row;justify-content:center;gap:9px;font-size:14px}
  #bar .add::after{content:'Lançar';font-weight:700}
  #bar .dot{top:50%;right:14px;transform:translateY(-50%)}
  .wrap{padding-bottom:48px}
}

.c{background:var(--card);border:1px solid var(--cbd);border-radius:16px;padding:14px 16px;margin-top:12px;box-shadow:var(--sh)}
.c>h2{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--mut);margin:0 0 8px;font-weight:700}

/* saldo em cima da faixa colorida, em branco */
.hero{margin-top:18px}
.hero small{font-size:11px;text-transform:uppercase;letter-spacing:.8px;font-weight:700;opacity:.75}
.hero .num{font-size:33px;font-weight:750;letter-spacing:-1.4px;margin-top:3px;font-variant-numeric:tabular-nums;line-height:1.1}
.hero .hsub{font-size:12.5px;margin-top:6px;opacity:.82}
.hero .hsub b{font-variant-numeric:tabular-nums}
/* os dois cards brancos que sobem por cima da curva */
.duo{display:flex;gap:11px;margin-top:0}
.duo>div{flex:1;background:var(--card);border:1px solid var(--cbd);border-radius:14px;padding:12px 14px;box-shadow:var(--sh);min-width:0}
.duo small{display:block;color:var(--mut);font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;font-weight:700}
.duo b{display:block;font-size:17px;margin-top:3px;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.strip{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card);
 border:1px solid var(--cbd);border-left:4px solid var(--emp);border-radius:12px;padding:12px 15px;margin-top:12px;
 cursor:pointer;box-shadow:var(--sh)}
.strip .t{font-weight:650;font-size:14px}

.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--bd2)}
.row:last-child{border-bottom:0}
.row .l{min-width:0;flex:1}
.row .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:12.5px;color:var(--mut);margin-top:2px}
.v{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap;letter-spacing:-.3px}
.pos{color:var(--ok)} .neg{color:var(--no)} .mutc{color:var(--mut)} .empc{color:var(--emp)} .wnc{color:var(--wn)}
.big{display:flex;flex-wrap:wrap;gap:4px 22px}
.big>div{flex:1 1 130px;min-width:0}
.big small{display:block;color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.6px;font-weight:700}
.big strong{display:block;font-size:22px;margin-top:3px;font-variant-numeric:tabular-nums;letter-spacing:-.7px}
label{display:block;font-size:12px;color:var(--mut);font-weight:650;margin:12px 0 5px}
input,select,textarea{width:100%;padding:12px;border:1px solid var(--bd);border-radius:11px;background:var(--bg);color:var(--tx);font:inherit;outline:none}
input:focus,select:focus{border-color:var(--ac);box-shadow:0 0 0 3px rgba(15,95,67,.18)}
input[type=checkbox]{width:auto;box-shadow:none}
/* o valor é o campo mais importante do app: entra grande */
input.money{font-size:26px;font-weight:700;letter-spacing:-.8px;padding:12px;font-variant-numeric:tabular-nums}
.seg{display:flex;gap:4px;background:var(--bg);padding:4px;border-radius:12px}
.seg button{flex:1;padding:10px 6px;border:0;background:none;color:var(--mut);border-radius:9px;font:650 13px/1 inherit;cursor:pointer}
.seg button.on{background:var(--card);color:var(--tx);box-shadow:var(--sh),0 0 0 1px var(--bd)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
@media(max-width:520px){.g2{grid-template-columns:1fr}}
button.b{width:100%;padding:14px;border:0;border-radius:12px;background:var(--acBtn);color:#fff;font:700 15px/1 inherit;cursor:pointer;margin-top:16px}
button.b:active{transform:scale(.99)}
button.b.gh{background:var(--bg);color:var(--tx);box-shadow:0 0 0 1px var(--bd)}
button.b.dg{background:none;color:var(--no);box-shadow:0 0 0 1px var(--bd)}
button.s{background:var(--bg);border:1px solid var(--bd);color:var(--tx);border-radius:9px;padding:8px 12px;font:650 12.5px/1 inherit;cursor:pointer}
button.s.p{background:var(--acBtn);border-color:var(--acBtn);color:#fff}
.chk{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:14px;font-weight:650}
.chk input{width:20px;height:20px;accent-color:var(--ac)}
.tag{display:inline-block;font-size:10px;font-weight:700;padding:2px 6px;border-radius:5px;text-transform:uppercase;letter-spacing:.4px;vertical-align:middle}
.tag.e{background:var(--empbg);color:var(--emp)} .tag.p{background:var(--wnbg);color:var(--wn)}
.tag.k{background:var(--bg);color:var(--mut);border:1px solid var(--bd)}
.bar{height:7px;background:var(--bd);border-radius:4px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--ok);border-radius:4px}
.bar i.w{background:var(--wn)} .bar i.d{background:var(--no)}
.empty{color:var(--mut);text-align:center;padding:26px 8px;font-size:14px}
.mask{position:fixed;inset:0;background:rgba(8,11,15,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50;backdrop-filter:blur(2px)}
@media(min-width:600px){.mask{align-items:center}}
.mdl{background:var(--card);border-radius:20px 20px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));width:100%;max-width:520px;max-height:88vh;overflow:auto;animation:up .18s ease-out}
@media(min-width:600px){.mdl{border-radius:18px;padding-bottom:20px}}
@keyframes up{from{transform:translateY(14px);opacity:.4}}
.mdl h3{margin:0 0 4px;font-size:18px;letter-spacing:-.4px}
.mdl .grab{width:38px;height:4px;border-radius:3px;background:var(--bd);margin:-8px auto 14px}
@media(min-width:600px){.mdl .grab{display:none}}
.menu button{display:flex;align-items:center;gap:13px;width:100%;background:none;border:0;color:var(--tx);
 font:650 15px/1 inherit;padding:15px 4px;cursor:pointer;text-align:left;border-bottom:1px solid var(--bd2)}
.menu button:last-of-type{border-bottom:0}
.menu button.on{color:var(--ac)}
.menu svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto;color:var(--mut)}
.menu button.on svg{color:var(--ac)}
.menu .rt{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom));background:var(--tx);color:var(--card);padding:12px 18px;border-radius:12px;font-size:13px;font-weight:650;z-index:99;max-width:88%;text-align:center;box-shadow:0 8px 26px rgba(0,0,0,.28)}
.warn{background:var(--wnbg);color:var(--wn);border-radius:12px;padding:12px 14px;font-size:13px;font-weight:650;margin-top:12px;line-height:1.45}
.hint{font-size:12.5px;color:var(--mut);margin-top:9px;line-height:1.55}
.it{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--bd2)}
.it:last-child{border-bottom:0}
.it input[type=checkbox]{width:21px;height:21px;accent-color:var(--emp);flex:0 0 auto}
.clk{cursor:pointer}

/* ---- gráficos ----
   Paleta validada com o script do guia de visualização, contra as superfícies
   reais deste app (#fff claro / #181c22 escuro). Não trocar tom no olhômetro:
   a ordem dos tons é o que garante separação para daltonismo. */
.viz{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;
 --pos:#008300;--neg:#e34948;--grid:#e1e0d9;--eixo:#c3c2b7;--tinta:#52514e}
@media(prefers-color-scheme:dark){.viz{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;
 --neg:#e66767;--grid:#2c2c2a;--eixo:#383835;--tinta:#c3c2b7}}
.viz svg{display:block;width:100%;height:auto;overflow:visible}
.viz .gd{stroke:var(--grid);stroke-width:1}
.viz .ex{stroke:var(--eixo);stroke-width:1}
.viz text{fill:var(--tinta);font:600 10px/1 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.viz .tk{fill:var(--mut);font-weight:600;font-variant-numeric:tabular-nums}
.viz .rot{font-size:11px;font-weight:700}
.viz [data-info]{cursor:pointer}
/* leitura fica sempre visível: o valor nunca depende de passar o dedo em cima */
.lida{font-size:12.5px;color:var(--mut);margin:2px 0 10px;min-height:17px}
.lida b{color:var(--tx);font-variant-numeric:tabular-nums}
.leg{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:12px}
.leg>div{display:flex;align-items:center;gap:7px;font-size:12.5px;min-width:0}
.leg i{width:10px;height:10px;border-radius:3px;flex:0 0 auto}
.leg .nm{color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.leg .vl{font-weight:700;font-variant-numeric:tabular-nums;margin-left:auto}
.legt>div{width:100%}
.vazio{color:var(--mut);text-align:center;padding:30px 8px;font-size:13.5px}
</style>
</head>
<body>
<header><div class="hd" id="hd"></div></header>
<div class="wrap"><div id="view"></div></div>
<nav id="bar"></nav>
<div id="mdl"></div>

<script>
'use strict';
/* ============ base ============ */
const K='cf_v1';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const p2=n=>String(n).padStart(2,'0');
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* dinheiro em centavos (inteiro) — evita erro de arredondamento de float */
const fmt=c=>(c/100).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const R=c=>(c<0?'-':'')+'R$ '+fmt(Math.abs(c));
function parseMoney(s){
  s=String(s??'').replace(/[^\d.,-]/g,'');
  if(!s)return 0;
  const neg=s.includes('-'); s=s.replace(/-/g,'');
  const li=Math.max(s.lastIndexOf(','),s.lastIndexOf('.'));
  let int=s,dec='';
  if(li>=0&&s.length-li-1<=2&&s.length-li-1>0){int=s.slice(0,li);dec=s.slice(li+1);}
  int=int.replace(/[.,]/g,'');
  dec=(dec+'00').slice(0,2);
  const v=Number(int||0)*100+Number(dec||0);
  return neg?-v:v;
}

const hoje=()=>{const d=new Date();return `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`};
const mesDe=d=>d.slice(0,7);
const ultDia=(y,m)=>new Date(y,m,0).getDate();
function addMes(ym,n){let[y,m]=ym.split('-').map(Number);m+=n;y+=Math.floor((m-1)/12);m=((m-1)%12+12)%12+1;return `${y}-${p2(m)}`}
function addMesData(d,n){const[y,m,dd]=d.split('-').map(Number);const ym=addMes(`${y}-${p2(m)}`,n);const[ny,nm]=ym.split('-').map(Number);return `${ym}-${p2(Math.min(dd,ultDia(ny,nm)))}`}
const MESES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const lblMes=ym=>{const[y,m]=ym.split('-');return MESES[+m-1]+'/'+y};
const dDia=d=>d.slice(8,10)+'/'+d.slice(5,7);
const diasEntre=(a,b)=>Math.round((new Date(b)-new Date(a))/864e5);

/* ============ dados ============ */
const CATS_PADRAO=[
  ['Mercado','saida'],['Transporte','saida'],['Casa','saida'],['Saúde','saida'],
  ['Alimentação fora','saida'],['Lazer','saida'],['Educação','saida'],['Vestuário','saida'],
  ['Assinaturas','saida'],['Outros','saida'],
  ['Salário','entrada'],['Extra','entrada'],['Outros','entrada']
];
let db;
function novoDb(){
  return {
    v:2,
    contas:[{id:uid(),nome:'Dinheiro',tipo:'dinheiro',saldoInicial:0,arq:false}],
    cats:CATS_PADRAO.map(([nome,tipo])=>({id:uid(),nome,tipo,arq:false})),
    pessoas:[{id:uid(),nome:'Empresa',empresa:true,arq:false}],
    orc:{}, fixas:[], lanc:[], backup:0
  };
}
/* v1 só sabia dever para "a empresa"; v2 tem devedor e valor devido parcial */
function migrar(){
  if(db.v>=2)return;
  if(!Array.isArray(db.pessoas)||!db.pessoas.length)
    db.pessoas=[{id:uid(),nome:'Empresa',empresa:true,arq:false}];
  const emp=db.pessoas.find(p=>p.empresa)||db.pessoas[0];
  for(const l of db.lanc){
    if(l.empresa){ l.devedorId=emp.id; l.naoMeu=l.valor; }
    if(l.credEmpresa>0||l.credTotal>0){
      l.cred=l.credEmpresa||0;
      l.credTotal=l.credTotal||l.credEmpresa||0;
      l.devedorId=l.devedorId||emp.id;
    }
    delete l.credEmpresa;
  }
  db.v=2;
}
function load(){
  try{db=JSON.parse(localStorage.getItem(K));}catch(e){db=null}
  if(!db||!db.contas)db=novoDb();
  for(const k of ['contas','cats','fixas','lanc','pessoas'])if(!Array.isArray(db[k]))db[k]=[];
  if(!db.orc)db.orc={};
  migrar();
}
const save=()=>localStorage.setItem(K,JSON.stringify(db));

/* ============ consultas ============ */
const conta=id=>db.contas.find(c=>c.id===id);
const cat=id=>db.cats.find(c=>c.id===id);
const isCartao=id=>{const c=conta(id);return !!c&&c.tipo==='cartao'};
const isInvest=id=>{const c=conta(id);return !!c&&c.tipo==='invest'};
/* conta de gasto = de onde sai dinheiro do dia a dia. Cartão tem fatura, e
   aplicação é dinheiro guardado — nenhum dos dois entra no saldo disponível. */
const ehGasto=c=>c.tipo!=='cartao'&&c.tipo!=='invest';
const contasAtivas=(inclCartao=true,inclInvest=false)=>db.contas.filter(c=>!c.arq&&
  (c.tipo==='cartao'?inclCartao:(c.tipo==='invest'?inclInvest:true)));
const cartoes=()=>db.contas.filter(c=>c.tipo==='cartao'&&!c.arq);
const aplicacoes=()=>db.contas.filter(c=>c.tipo==='invest'&&!c.arq);
const nomeConta=id=>{const c=conta(id);return c?c.nome:'?'};
const pessoa=id=>db.pessoas.find(p=>p.id===id);
const pessoasAtivas=()=>db.pessoas.filter(p=>!p.arq);
const nomePessoa=id=>{const p=pessoa(id);return p?p.nome:'alguém'};
const ehEmpresa=id=>{const p=pessoa(id);return !!p&&!!p.empresa};

/* qual fatura recebe uma compra: até o dia do fechamento entra na fatura do próprio mês */
function faturaRef(c,data){
  const[y,m,d]=data.split('-').map(Number);
  const ym=`${y}-${p2(m)}`;
  return d>c.fechamento?addMes(ym,1):ym;
}
/* vencimento: se o dia de vencimento é <= o de fechamento, vence no mês seguinte ao fechamento */
function faturaVenc(c,ref){
  const alvo=c.vencimento<=c.fechamento?addMes(ref,1):ref;
  const[y,m]=alvo.split('-').map(Number);
  return `${alvo}-${p2(Math.min(c.vencimento,ultDia(y,m)))}`;
}
/* ajuste nunca entra na fatura: o dinheiro dele já saiu na compra original */
const faturaItens=(cid,ref)=>{const c=conta(cid);return db.lanc.filter(l=>l.tipo==='saida'&&!l.ajuste&&l.contaId===cid&&faturaRef(c,l.data)===ref)};
const faturaTotal=(cid,ref)=>faturaItens(cid,ref).reduce((s,l)=>s+l.valor,0);
const faturaPago=(cid,ref)=>db.lanc.filter(l=>l.tipo==='fatura'&&l.destId===cid&&l.faturaRef===ref).reduce((s,l)=>s+l.valor,0);
const faturaAberto=(cid,ref)=>faturaTotal(cid,ref)-faturaPago(cid,ref);
/* fatura ainda não fechou? */
function faturaEmAberto(c,ref){
  const h=hoje();
  return faturaRef(c,h)===ref||ref>faturaRef(c,h);
}
function refsCartao(cid){
  const c=conta(cid);
  const s=new Set(db.lanc.filter(l=>l.tipo==='saida'&&l.contaId===cid).map(l=>faturaRef(c,l.data)));
  db.lanc.filter(l=>l.tipo==='fatura'&&l.destId===cid).forEach(l=>s.add(l.faturaRef));
  s.add(faturaRef(c,hoje()));
  return [...s].sort();
}

function saldo(cid){
  const c=conta(cid); if(!c||c.tipo==='cartao')return 0;
  let s=c.saldoInicial||0;
  for(const l of db.lanc){
    if(l.ajuste)continue;
    if(l.tipo==='saida'&&l.contaId===cid&&l.pago)s-=l.valor;
    else if(l.tipo==='entrada'&&l.contaId===cid&&l.pago)s+=l.valor;
    else if(l.tipo==='transf'){if(l.contaId===cid)s-=l.valor;if(l.destId===cid)s+=l.valor;}
    else if(l.tipo==='fatura'&&l.contaId===cid)s-=l.valor;
    else if(l.tipo==='reemb'&&l.contaId===cid)s+=l.valor;
    else if(l.tipo==='rend'&&l.contaId===cid)s+=l.valor;   /* pode ser negativo */
  }
  return s;
}
/* saldo disponível: só o que dá para gastar hoje. Aplicação fica de fora. */
const saldoTotal=()=>db.contas.filter(c=>ehGasto(c)&&!c.arq).reduce((s,c)=>s+saldo(c.id),0);

/* ---- investimentos ---- */
const rendimento=id=>db.lanc.filter(l=>l.tipo==='rend'&&l.contaId===id).reduce((s,l)=>s+l.valor,0);
const aportado=id=>saldo(id)-rendimento(id);
const totalInvestido=()=>aplicacoes().reduce((s,c)=>s+saldo(c.id),0);
const totalRendimento=()=>aplicacoes().reduce((s,c)=>s+rendimento(c.id),0);
const patrimonio=()=>saldoTotal()+totalInvestido();
/* data da última vez que você disse quanto a aplicação vale */
function atualizadoEm(id){
  const rs=db.lanc.filter(l=>l.tipo==='rend'&&l.contaId===id).map(l=>l.data).sort();
  return rs.length?rs[rs.length-1]:null;
}

/* previsto: saldo de hoje + o que ainda entra/sai até o fim do mês, incluindo faturas a vencer */
function previsto(ym){
  const[y,m]=ym.split('-').map(Number);
  const fim=`${ym}-${p2(ultDia(y,m))}`;
  let s=saldoTotal();
  for(const l of db.lanc){
    if(l.ajuste||l.pago||l.data>fim)continue;
    if(isCartao(l.contaId))continue;
    if(l.tipo==='saida')s-=l.valor; else if(l.tipo==='entrada')s+=l.valor;
  }
  for(const c of cartoes())for(const ref of refsCartao(c.id)){
    const ab=faturaAberto(c.id,ref);
    if(ab>0&&faturaVenc(c,ref)<=fim)s-=ab;
  }
  return s;
}
/* o que ainda não voltou. `cred` é o que falta receber, `credTotal` o combinado */
const aReceber=(filtro)=>itensReceber(filtro).reduce((s,l)=>s+l.cred,0);
const itensReceber=(filtro)=>db.lanc.filter(l=>(l.cred||0)>0&&(!filtro||filtro(l)))
                                    .sort((a,b)=>a.data<b.data?-1:1);
const daEmpresa=l=>ehEmpresa(l.devedorId);
/* devedores com saldo em aberto, empresa primeiro */
function devedores(){
  const mp=new Map();
  for(const l of itensReceber())mp.set(l.devedorId,(mp.get(l.devedorId)||0)+l.cred);
  return [...mp].map(([id,v])=>({id,v,nome:nomePessoa(id),empresa:ehEmpresa(id)}))
                .sort((a,b)=>(b.empresa-a.empresa)||(b.v-a.v));
}

/* estatísticas: regime de competência (data do lançamento).
   `meu` é a fatia do lançamento que é gasto seu — num rateio, só a sua parte. */
const meu=l=>Math.max(0,l.valor-(l.naoMeu||0));
function gastosMes(ym){return db.lanc.filter(l=>l.tipo==='saida'&&mesDe(l.data)===ym&&meu(l)>0)}
function receitasMes(ym){return db.lanc.filter(l=>l.tipo==='entrada'&&mesDe(l.data)===ym)}
const soma=a=>a.reduce((s,l)=>s+l.valor,0);
const somaMeu=a=>a.reduce((s,l)=>s+meu(l),0);
function porCategoria(ym){
  const mp={};
  for(const l of gastosMes(ym))mp[l.catId||'-']=(mp[l.catId||'-']||0)+meu(l);
  return Object.entries(mp).sort((a,b)=>b[1]-a[1]);
}

/* ============ contas fixas ============ */
function gerarFixas(){
  const atual=mesDe(hoje()); let n=0;
  for(const f of db.fixas){
    if(!f.ativa)continue;
    let ym=f.ultimoMes?addMes(f.ultimoMes,1):atual;
    let guard=0;
    while(ym<=atual&&guard++<24){
      const[y,m]=ym.split('-').map(Number);
      const data=`${ym}-${p2(Math.min(f.dia,ultDia(y,m)))}`;
      db.lanc.push({id:uid(),tipo:f.tipo,data,desc:f.desc,valor:f.valor,catId:f.catId,
        contaId:f.contaId,pago:isCartao(f.contaId),fixaId:f.id});
      f.ultimoMes=ym; n++; ym=addMes(ym,1);
    }
  }
  if(n){save();toast(`Criei ${n} lançamento${n>1?'s':''} de contas fixas`)}
}

/* ============ UI ============ */
let tab='inicio', mes=mesDe(hoje());
/* Carteira junta "me devem" e investimentos: as duas respondem "dinheiro meu que

const svg=k=>`<svg viewBox="0 0 24 24">${ICO[k]}</svg>`;
/* com 7 botões numa tela de 375px, "Orçamento" não cabe sem reticências.
   A tela continua se chamando Orçamento; só o rótulo da barra é curto. */
const CURTO={orcamento:'Metas',relatorio:'Gráficos'};
const rotulo=k=>CURTO[k]||TITULO[k];
/* relatório e orçamento na ponta esquerda; o dia a dia perto do polegar */
const BARRA=['relatorio','orcamento','inicio','lancar','extrato','cartoes','carteira'];

function toast(t){
  document.querySelectorAll('.toast').forEach(e=>e.remove());
  const d=document.createElement('div'); d.className='toast'; d.textContent=t;
  document.body.appendChild(d); setTimeout(()=>d.remove(),3200);
}
function render(){
  const porMes=POR_MES.includes(tab);
  const heroHtml=tab==='inicio'?hero():'';
  document.querySelector('header').className=heroHtml?'':'curto';
  $('#hd').innerHTML=`<div class="hdtop"><h1>${TITULO[tab]}</h1>`+(porMes?
    `<div class="mes"><button data-act="mes-">‹</button><b>${lblMes(mes)}</b><button data-act="mes+">›</button></div>`:'')
    +`<button class="eng ${tab==='config'?'on':''}" data-tab="config" aria-label="Ajustes">${svg('config')}</button>`
    +`</div>`+heroHtml;
  const ar=aReceber();
  $('#bar').innerHTML=BARRA.map(k=>{
    if(k==='lancar')return `<button class="add" data-tab="lancar" aria-label="Lançar">${svg('lancar')}</button>`;
    /* os dois rótulos sempre vão: o CSS mostra o curto na barra de baixo e o
       nome por extenso na coluna lateral, onde sobra largura */
    return `<button data-tab="${k}" class="${tab===k?'on':''}">${svg(k)}`
      +`<span class="curto">${rotulo(k)}</span><span class="longo">${TITULO[k]}</span>`
      +`${k==='carteira'&&ar>0?'<i class="dot"></i>':''}</button>`;
  }).join('');
  $('#view').innerHTML=VIEWS[tab]();
  window.scrollTo(0,0);
}

/* saldo dentro da faixa colorida do cabeçalho */
function hero(){
  const sa=saldoTotal(), pv=previsto(mes);
  return `<div class="hero"><small>Saldo atual</small>
    <div class="num">${R(sa)}</div>

/* ---- Início ---- */
function vInicio(){
  const ar=aReceber(), inv=totalInvestido(), rnd=totalRendimento();
  const g=somaMeu(gastosMes(mes)), r=soma(receitasMes(mes));
  const h=hoje(), lim=new Date(Date.now()+7*864e5).toISOString().slice(0,10);
  const venc=db.lanc.filter(l=>!l.pago&&!l.ajuste&&!isCartao(l.contaId)&&l.data<=lim&&(l.tipo==='saida'||l.tipo==='entrada'))
                    .sort((a,b)=>a.data<b.data?-1:1);
  const fat=[];
  for(const c of cartoes())for(const ref of refsCartao(c.id)){
    const ab=faturaAberto(c.id,ref), v=faturaVenc(c,ref);
    if(ab>0&&v<=lim&&!faturaEmAberto(c,ref))fat.push({c,ref,ab,v});
  }
  /* parcela futura tem data lá na frente e não é "último lançamento".
     rendimento também fica fora: não é coisa que você fez, é a aplicação rendendo. */
  const ult=db.lanc.filter(l=>l.data<=h&&l.tipo!=='rend').sort((a,b)=>a.data<b.data?1:-1).slice(0,8);

  let bkp='';
  const dias=db.backup?diasEntre(new Date(db.backup).toISOString().slice(0,10),h):999;
  if(dias>7)bkp=`<div class="warn">⚠️ ${db.backup?`Último backup há ${dias} dias.`:'Você nunca fez backup.'} Os dados vivem só neste aparelho — vá em Config › Exportar.</div>`;

  return `
  <div class="duo">
    <div><small>Entrou em ${lblMes(mes)}</small><b class="pos">${R(r)}</b></div>
    <div><small>Saiu em ${lblMes(mes)}</small><b class="neg">${R(g)}</b></div>
  </div>
  ${ar>0?`<div class="strip" data-tab="carteira">
    <div><div class="t empc">Me devem</div><div class="sub">${devedores().map(d=>d.nome).join(', ')} — toque para ver</div></div>
    <div class="v empc" style="font-size:18px">${R(ar)}</div></div>`:''}
  ${inv>0?`<div class="strip" style="border-left-color:var(--ac)" data-tab="carteira">
    <div><div class="t">Investido</div>
    <div class="sub">${rnd>=0?'rendeu':'perdeu'} ${R(Math.abs(rnd))} — toque para ver</div></div>
    <div class="v" style="font-size:18px">${R(inv)}</div></div>`:''}
  ${bkp}
  <div class="c"><h2>Vence nos próximos 7 dias</h2>
  ${(venc.length||fat.length)?
    fat.map(f=>`<div class="row"><div class="l"><div class="t">Fatura ${esc(f.c.nome)} <span class="tag p">fatura</span></div><div class="sub">vence ${dDia(f.v)}${f.v<h?' · atrasada':''}</div></div><div class="v neg">${R(f.ab)}</div></div>`).join('')+
    venc.map(l=>`<div class="row clk" data-lanc="${l.id}"><div class="l"><div class="t">${esc(l.desc)}</div><div class="sub">${dDia(l.data)} · ${esc(nomeConta(l.contaId))}${l.data<h?' · <span class="wnc">atrasado</span>':''}</div></div><div class="v ${l.tipo==='entrada'?'pos':'neg'}">${R(l.valor)}</div></div>`).join('')
    :'<div class="empty">Nada vencendo. 👌</div>'}
  </div>

  <div class="c"><h2>Últimos lançamentos</h2>
  ${ult.length?ult.map(linhaLanc).join(''):'<div class="empty">Nenhum lançamento ainda.</div>'}</div>`;
}

function linhaLanc(l){
  const neg=l.tipo==='saida'||l.tipo==='fatura';
  let dir='', tags='';
  if(l.tipo==='transf')dir=`${esc(nomeConta(l.contaId))} → ${esc(nomeConta(l.destId))}`;
  else if(l.tipo==='fatura')dir=`${esc(nomeConta(l.contaId))} → ${esc(nomeConta(l.destId))}`;
  else dir=esc(nomeConta(l.contaId))+(l.catId&&cat(l.catId)?' · '+esc(cat(l.catId).nome):'');
  if(l.devedorId)tags+=` <span class="tag e">${esc(nomePessoa(l.devedorId))}</span>`;
  if(l.parcs>1)tags+=` <span class="tag k">${l.parc}/${l.parcs}</span>`;
  if(!l.pago&&!l.ajuste&&(l.tipo==='saida'||l.tipo==='entrada'))tags+=' <span class="tag p">pendente</span>';
  if(l.ajuste)tags+=' <span class="tag k">ajuste</span>';
  if(l.tipo==='rend'){
    return `<div class="row"><div class="l"><div class="t">${esc(l.desc)} <span class="tag k">rendimento</span></div>
      <div class="sub">${dDia(l.data)} · ${esc(nomeConta(l.contaId))} · não conta como receita</div></div>
      <div class="v ${l.valor<0?'neg':'pos'}">${l.valor<0?'−':'+'}${R(Math.abs(l.valor))}</div></div>`;
  }
  const cls=l.tipo==='transf'?'mutc':(l.tipo==='reemb'?'empc':(neg?'neg':'pos'));
  return `<div class="row clk" data-lanc="${l.id}"><div class="l"><div class="t">${esc(l.desc)}${tags}</div><div class="sub">${dDia(l.data)} · ${dir}</div></div><div class="v ${cls}">${neg?'−':(l.tipo==='transf'?'':'+')}${R(l.valor)}</div></div>`;
}

/* ---- Lançar ---- */
const novoVazio=()=>({tipo:'saida',data:hoje(),desc:'',valor:'',contaId:'',catId:'',destId:'',
  parcs:1,devem:false,devedorId:'',devolve:'',pago:true});
let novo=novoVazio();
function vLancar(){
  const cs=contasAtivas(true);
  if(!novo.contaId&&cs.length)novo.contaId=cs[0].id;
  if(novo.devem&&!novo.devedorId&&pessoasAtivas().length)novo.devedorId=pessoasAtivas()[0].id;
  const cartao=isCartao(novo.contaId);
  const cats=db.cats.filter(c=>!c.arq&&c.tipo===novo.tipo);
  const opts=(arr,sel,key='nome')=>arr.map(o=>`<option value="${o.id}" ${o.id===sel?'selected':''}>${esc(o[key])}</option>`).join('');

  if(novo.tipo==='transf'){
    const nc=contasAtivas(false,true);   /* aportar e resgatar são transferências */
    if(!novo.destId&&nc[1])novo.destId=nc[1].id;
    return `<div class="c">${segTipo()}
      <div class="g2">
        <div><label>De</label><select data-f="contaId" data-r>${opts(nc,novo.contaId)}</select></div>
        <div><label>Para</label><select data-f="destId" data-r>${opts(nc,novo.destId)}</select></div>
      </div>
      <div class="g2">
        <div><label>Valor</label><input class="money" data-f="valor" inputmode="decimal" placeholder="0,00" value="${esc(novo.valor)}"></div>
        <div><label>Data</label><input data-f="data" type="date" value="${novo.data}"></div>
      </div>
      <label>Descrição</label><input data-f="desc" placeholder="Ex: saque" value="${esc(novo.desc)}">
      <button class="b" data-act="salvar">Salvar transferência</button>
      <div class="hint">Transferência não entra em nenhum relatório — só muda o dinheiro de lugar.</div></div>`;
  }

  return `<div class="c">${segTipo()}
    <div class="g2">
      <div><label>Valor</label><input class="money" data-f="valor" inputmode="decimal" placeholder="0,00" value="${esc(novo.valor)}"></div>
      <div><label>Data</label><input data-f="data" type="date" value="${novo.data}"></div>
    </div>
    <label>Descrição</label><input data-f="desc" placeholder="Ex: mercado da esquina" value="${esc(novo.desc)}">
    <label>Conta</label><select data-f="contaId" data-r>${opts(cs,novo.contaId)}</select>
    ${novo.tipo==='saida'?`<div class="chk"><input type="checkbox" data-f="devem" data-r ${novo.devem?'checked':''}><span>Alguém vai me devolver</span></div>
      ${novo.devem?(pessoasAtivas().length?`
        <div class="g2">
          <div><label>De quem</label><select data-f="devedorId">${opts(pessoasAtivas(),novo.devedorId)}</select></div>
          <div><label>Quanto me devem</label><input data-f="devolve" inputmode="decimal" placeholder="${esc(novo.valor)||'0,00'}" value="${esc(novo.devolve)}"></div>
        </div>
        <div class="hint">${dicaRateio()}</div>`
        :'<div class="hint">Cadastre uma pessoa em Ajustes › Pessoas primeiro.</div>'):''}`:''}
    <label>Categoria</label><select data-f="catId">${opts(cats,novo.catId)}</select>
    ${cartao?`<label>Parcelas</label><input data-f="parcs" type="number" min="1" max="48" value="${novo.parcs}" data-r>
      ${novo.parcs>1?`<div class="hint">${previewParcelas()}</div>`:''}
      <div class="hint">Compra no cartão entra na fatura de <b>${lblMes(faturaRef(conta(novo.contaId),novo.data))}</b>.</div>`
     :`<div class="chk"><input type="checkbox" data-f="pago" ${novo.pago?'checked':''}><span>${novo.tipo==='saida'?'Já paguei':'Já recebi'}</span></div>
       ${!novo.pago?'<div class="hint">Fica pendente: não mexe no saldo, aparece em “a vencer”.</div>':''}`}
    <button class="b" data-act="salvar">Salvar</button></div>`;
}
function segTipo(){
  return `<div class="seg">${[['saida','Saída'],['entrada','Entrada'],['transf','Transferência']]
    .map(([k,l])=>`<button data-tp="${k}" class="${novo.tipo===k?'on':''}">${l}</button>`).join('')}</div>`;
}
/* deixa a divisão visível antes de salvar, que é onde o erro de rateio aparece */
function dicaRateio(){
  const v=parseMoney(novo.valor);
  const d=novo.devolve.trim()?parseMoney(novo.devolve):v;
  const quem=esc(nomePessoa(novo.devedorId));
  if(!v)return `Deixe em branco se te devem o valor inteiro.`;
  if(d>=v)return `Nada disso entra nas suas estatísticas — <b>${quem}</b> te deve os ${R(v)}.`;
  if(d<=0)return `Sem dívida: os ${R(v)} contam como gasto seu.`;
  return `Gasto seu: <b>${R(v-d)}</b> · <b>${quem}</b> te deve <b class="empc">${R(d)}</b>.`;
}
function previewParcelas(){
  const v=parseMoney(novo.valor), n=+novo.parcs;
  if(!v||n<2)return '';
  const p=divide(v,n);
  return `${n}× — ${p[0]===p[1]?R(p[0]):`primeira de ${R(p[0])}, demais de ${R(p[1])}`}`;
}
/* divide centavos exatos: a sobra vai na primeira parcela */
function divide(total,n){
  const base=Math.floor(total/n), resto=total-base*n;
  return Array.from({length:n},(_,i)=>base+(i===0?resto:0));
}

function salvar(){
  const v=parseMoney(novo.valor);
  if(v<=0)return toast('Informe um valor');
  if(!novo.contaId)return toast('Escolha uma conta');
  if(novo.tipo==='transf'){
    if(novo.contaId===novo.destId)return toast('Contas de origem e destino iguais');
    db.lanc.push({id:uid(),tipo:'transf',data:novo.data,desc:novo.desc||'Transferência',valor:v,
      contaId:novo.contaId,destId:novo.destId,pago:true});
  }else{
    const cartao=isCartao(novo.contaId);
    const n=cartao?Math.max(1,Math.min(48,+novo.parcs||1)):1;
    const partes=divide(v,n), compraId=uid();
    /* quanto do total não é gasto seu; em branco = te devem tudo */
    const devem=novo.tipo==='saida'&&novo.devem&&novo.devedorId;
    const dev=devem?Math.min(v,novo.devolve.trim()?parseMoney(novo.devolve):v):0;
    const fatias=divide(dev,n);   /* a parte devida acompanha cada parcela... */
    for(let i=0;i<n;i++){
      db.lanc.push({id:uid(),tipo:novo.tipo,data:i?addMesData(novo.data,i):novo.data,
        desc:novo.desc||'(sem descrição)',valor:partes[i],
        catId:novo.catId,contaId:novo.contaId,
        pago:cartao?true:!!novo.pago,
        devedorId:dev>0?novo.devedorId:null,
        naoMeu:dev>0?fatias[i]:0,
        /* ...mas a cobrança vem inteira no mês da compra, então o crédito fica todo na 1ª */
        cred:(dev>0&&i===0)?dev:0,
        credTotal:(dev>0&&i===0)?dev:0,
        compraId:n>1?compraId:null,parc:n>1?i+1:null,parcs:n>1?n:null});
    }
  }
  save();
  const d=novo.data;
  novo={...novoVazio(),tipo:novo.tipo,data:d,contaId:novo.contaId,catId:novo.catId,
        destId:novo.destId,devedorId:novo.devedorId};
  toast('Lançado');
  tab='extrato'; mes=mesDe(d); render();
}

function registrarReembolso(){
  const its=itensReceber().filter(l=>sel.has(l.id));

  const quem=[...new Set(its.map(l=>nomePessoa(l.devedorId)))];
  formModal('Registrar recebimento',[
    {k:'valor',label:'Valor recebido',type:'text',v:fmt(tot)},
    {k:'contaId',label:'Caiu em qual conta',type:'select',opts:contasAtivas(false),v:contasAtivas(false)[0]?.id},
    {k:'data',label:'Data',type:'date',v:hoje()}
  ],d=>{
    let v=parseMoney(d.valor);
    if(v<=0)return toast('Valor inválido');
    if(v>tot)return toast('Valor maior que o total selecionado');
    db.lanc.push({id:uid(),tipo:'reemb',data:d.data,desc:'Recebido de '+quem.join(', '),valor:v,
      contaId:d.contaId,pago:true,itens:its.map(l=>l.id)});
    /* abate do mais antigo pro mais novo; o que não cobrir continua pendente */
    for(const l of its){

/* saldo no fim de um dia. Até hoje conta só o que foi pago (é o que existiu de
   verdade); depois de hoje entra o previsto, incluindo fatura que vence no meio. */
function saldoDia(d){
  const h=hoje(), futuro=d>h;
  let s=db.contas.filter(c=>ehGasto(c)&&!c.arq).reduce((a,c)=>a+(c.saldoInicial||0),0);
  for(const l of db.lanc){
    if(l.ajuste||l.data>d)continue;
    if(isCartao(l.contaId)||isInvest(l.contaId))continue;  /* nem cartão nem aplicação movem caixa */
    if(!l.pago&&!futuro)continue;
    if(l.tipo==='saida')s-=l.valor;
    else if(l.tipo==='entrada')s+=l.valor;
    else if(l.tipo==='fatura')s-=l.valor;
    else if(l.tipo==='reemb')s+=l.valor;
    else if(l.tipo==='transf'&&isInvest(l.destId))s-=l.valor;  /* aporte sai do disponível */
  }
  /* resgate: a transferência sai da aplicação, então o laço acima a descartou */
  for(const l of db.lanc){
    if(l.tipo!=='transf'||l.data>d)continue;
    if(isInvest(l.contaId)&&!isInvest(l.destId))s+=l.valor;
  }
  if(futuro)for(const c of cartoes())for(const ref of refsCartao(c.id)){
    const ab=faturaAberto(c.id,ref), v=faturaVenc(c,ref);
    if(ab>0&&v<=d&&v>h)s-=ab;
  }
  return s;
}
/* quanto de um mês já está vendido antes de começar */
function comprometido(ym){
  const atual=mesDe(hoje());
  let cartao=0;
  for(const c of cartoes())for(const ref of refsCartao(c.id)){
    const ab=faturaAberto(c.id,ref);
    if(ab>0&&mesDe(faturaVenc(c,ref))===ym)cartao+=ab;
  }
  let fixas;
  if(ym<=atual)  /* já viraram lançamento: usa o que está pendente, senão conta duas vezes */
    fixas=db.lanc.filter(l=>l.fixaId&&l.tipo==='saida'&&!l.pago&&mesDe(l.data)===ym&&!isCartao(l.contaId))
                 .reduce((s,l)=>s+l.valor,0);
  else
    fixas=db.fixas.filter(f=>f.ativa&&f.tipo==='saida'&&!isCartao(f.contaId))
                  .reduce((s,f)=>s+f.valor,0);
  return {cartao,fixas,total:cartao+fixas};
}

/* ============ desenho ============ */
const CORES=['var(--s1)','var(--s2)','var(--s3)','var(--s4)','var(--s5)','var(--s6)'];
const inf=t=>`data-info="${esc(t)}"`;
/* coluna com topo arredondado e base reta, como manda a especificação de marcas */
function col(x,y,w,h,r=4){
  if(h<=0)return '';
  const rr=Math.min(r,w/2,h);
  return `M${x} ${y+h}V${y+rr}a${rr} ${rr} 0 0 1 ${rr} -${rr}h${w-2*rr}a${rr} ${rr} 0 0 1 ${rr} ${rr}V${y+h}Z`;
}
/* escala do eixo Y arredondada para número limpo */
function escala(maxV){
  if(maxV<=0)return {top:100,passo:50};
  const bruto=maxV/2, ordem=Math.pow(10,Math.floor(Math.log10(bruto)));
  const passo=[1,2,2.5,5,10].map(m=>m*ordem).find(p=>p>=bruto)||10*ordem;
  return {top:Math.ceil(maxV/passo)*passo,passo};
}
const kR=c=>{const v=c/100;return Math.abs(v)>=1000?(v/1000).toFixed(v%1000?1:0).replace('.',',')+'k':String(Math.round(v))};

/* ---- Relatório ---- */
const bloco=(titulo,lida,corpo,dica)=>`<div class="c"><h2>${titulo}</h2>
  <div class="lida">${lida}</div>${corpo}${dica?`<div class="hint">${dica}</div>`:''}</div>`;

/* rosca com legenda-tabela. No máximo 6 fatias — passando disso as cores
   adjacentes borram. O valor mora na legenda, nunca em cima da fatia:
   três tons da paleta ficam abaixo de 3:1 no fundo claro. */
function rosca(fat,tot,sufixo,titulo){
  const r=54, C=2*Math.PI*r;
  let acc=0;
  const arcos=fat.map((f,i)=>{
    const fr=f.v/tot, len=Math.max(1,C*fr-2);   /* 2px de folga entre fatias */
    const s=`<circle cx="70" cy="70" r="${r}" fill="none" stroke="${CORES[i]}" stroke-width="17"
      stroke-dasharray="${len.toFixed(2)} ${(C-len).toFixed(2)}" stroke-dashoffset="${(-C*acc).toFixed(2)}"
      transform="rotate(-90 70 70)" ${inf(`${f.nome}: ${R(f.v)} — ${Math.round(fr*100)}% ${sufixo}`)}/>`;
    acc+=fr; return s;
  }).join('');
  const legenda=fat.map((f,i)=>`<div ${inf(`${f.nome}: ${R(f.v)} — ${Math.round(f.v/tot*100)}% ${sufixo}`)}>
    <i style="background:${CORES[i]}"></i><span class="nm">${esc(f.nome)}</span>
    <span class="vl">${R(f.v)}<span class="mutc" style="font-weight:400"> ${Math.round(f.v/tot*100)}%</span></span></div>`).join('');
  return `<svg viewBox="0 0 140 140" style="max-width:190px;margin:2px auto 0" role="img"
      aria-label="${esc(titulo)}">${arcos}
     <text x="70" y="67" text-anchor="middle" style="font-size:9px;fill:var(--mut)">TOTAL</text>
     <text x="70" y="82" text-anchor="middle" style="font-size:15px;font-weight:700">${R(tot)}</text></svg>
    <div class="leg legt">${legenda}</div>`;
}

/* 1. gastos do mês por categoria */
function gRosca(){
  const todos=porCategoria(mes), tot=todos.reduce((s,[,v])=>s+v,0);
  if(!tot)return bloco(`Para onde foi — ${lblMes(mes)}`,'',
    `<div class="vazio">Nenhum gasto seu em ${lblMes(mes)}.</div>`);
  const top=todos.slice(0,5).map(([id,v])=>({nome:cat(id)?cat(id).nome:'Sem categoria',v}));
  const resto=todos.slice(5).reduce((s,[,v])=>s+v,0);
  const fat=resto>0?[...top,{nome:'Outros',v:resto}]:top;
  return bloco(`Para onde foi — ${lblMes(mes)}`,`Total de gastos seus: <b>${R(tot)}</b>`,
    rosca(fat,tot,'do mês','Gastos por categoria em '+lblMes(mes)),
    resto>0?(todos.length-5===1?'A categoria menor está somada em “Outros”.'
            :`As ${todos.length-5} categorias menores estão somadas em “Outros”.`):'');
}

/* 2. saldo dia a dia: traço cheio no que já aconteceu, tracejado na projeção */
function gSaldo(){
  const [y,m]=mes.split('-').map(Number), nd=ultDia(y,m), h=hoje();
  const pts=[]; for(let d=1;d<=nd;d++){const dt=`${mes}-${p2(d)}`;pts.push({d,dt,v:saldoDia(dt)})}
  /* linha de saldo mostra a faixa real: forçar o zero achata a variação do mês
     e a linha vira um traço reto que não informa nada. O zero entra quando o
     saldo chega perto dele — que é justamente quando ele importa. */
  const vs=pts.map(p=>p.v);
  let lo=Math.min(...vs), hi=Math.max(...vs);
  if(lo<0)hi=Math.max(hi,0);
  else if(lo<hi*0.25)lo=0;
  const folga=(hi-lo)*0.12||1000;
  if(lo!==0)lo-=folga;
  hi+=folga;
  const faixa=(hi-lo)||1000;
  const X0=38,X1=308,Y0=12,Y1=112;
  const px=d=>X0+(d-1)/(nd-1||1)*(X1-X0);
  const py=v=>Y1-(v-lo)/faixa*(Y1-Y0);
  const hojeIdx=pts.findIndex(p=>p.dt>=h);
  const corte=h<`${mes}-01`?0:(h>`${mes}-${p2(nd)}`?nd:(hojeIdx<0?nd:hojeIdx+1));
  const linha=a=>a.map((p,i)=>`${i?'L':'M'}${px(p.d).toFixed(1)} ${py(p.v).toFixed(1)}`).join(' ');
  const passado=pts.slice(0,corte), futuro=pts.slice(Math.max(0,corte-1));
  const fim=pts[pts.length-1], zeroY=py(0);
  const ticks=[lo,lo+faixa/2,hi].map(v=>`<line class="gd" x1="${X0}" y1="${py(v).toFixed(1)}" x2="${X1}" y2="${py(v).toFixed(1)}"/>
    <text class="tk" x="${X0-5}" y="${(py(v)+3).toFixed(1)}" text-anchor="end">${kR(v)}</text>`).join('');
  const alvos=pts.map(p=>`<rect x="${(px(p.d)-4).toFixed(1)}" y="${Y0}" width="8" height="${Y1-Y0}" fill="transparent"
    ${inf(`Dia ${p.d}: ${R(p.v)}${p.dt>h?' (previsto)':''}`)}/>`).join('');
  return bloco(`Saldo ao longo de ${lblMes(mes)}`,
    `Fecha o mês com <b class="${fim.v<0?'neg':''}">${R(fim.v)}</b>`,
    `<svg viewBox="0 0 320 138" role="img" aria-label="Saldo dia a dia em ${lblMes(mes)}">
      ${ticks}
      ${lo<0?`<line class="ex" x1="${X0}" y1="${zeroY.toFixed(1)}" x2="${X1}" y2="${zeroY.toFixed(1)}"/>`:''}
      ${passado.length>1?`<path d="${linha(passado)}" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`:''}
      ${futuro.length>1?`<path d="${linha(futuro)}" fill="none" stroke="var(--s1)" stroke-width="2" stroke-dasharray="4 4" stroke-linecap="round"/>`:''}
      <circle cx="${px(fim.d).toFixed(1)}" cy="${py(fim.v).toFixed(1)}" r="4" fill="var(--s1)" stroke="var(--card)" stroke-width="2"/>
      <text class="tk" x="${X0}" y="${Y1+16}">dia 1</text>
      <text class="tk" x="${X1}" y="${Y1+16}" text-anchor="end">dia ${nd}</text>
      ${alvos}</svg>`,
    corte>0&&corte<nd?'Traço cheio é o que já aconteceu; tracejado é a projeção com o que ainda vence.':'');
}

/* 3. o que mais dói: quanto dos próximos meses já está vendido */
function gComprometido(){
  const base=mesDe(hoje());
  const ms=[]; for(let i=0;i<6;i++)ms.push(addMes(base,i));
  const dd=ms.map(m=>({m,...comprometido(m)}));
  const tot=Math.max(...dd.map(d=>d.total));
  if(!tot)return bloco('Já comprometido','',
    '<div class="vazio">Nada parcelado nem fixo à frente.</div>');
  const e=escala(tot), X0=38,X1=308,Y0=12,Y1=112;
  const larg=Math.min(24,(X1-X0)/6-10);
  const py=v=>Y1-v/e.top*(Y1-Y0);
  const barras=dd.map((d,i)=>{
    const cx=X0+(i+.5)*((X1-X0)/6)-larg/2;
    const hc=(Y1-py(d.cartao)), hf=(Y1-py(d.fixas));
    /* 2px de folga entre os dois pedaços da pilha */
    const yF=py(d.total), yC=Y1-hc;
    return `<g ${inf(`${lblMes(d.m)}: ${R(d.total)} — cartão ${R(d.cartao)}, fixas ${R(d.fixas)}`)}>
      <rect x="${cx-3}" y="${Y0}" width="${larg+6}" height="${Y1-Y0}" fill="transparent"/>
      ${d.cartao?`<path d="${col(cx,yC,larg,hc,d.fixas?0:4)}" fill="var(--s1)"/>`:''}
      ${d.fixas?`<path d="${col(cx,yF,larg,hf-(d.cartao?2:0),4)}" fill="var(--s2)"/>`:''}
      <text class="tk" x="${cx+larg/2}" y="${Y1+16}" text-anchor="middle">${MESES[+d.m.slice(5)-1]}</text></g>`;
  }).join('');
  const gy=[0,e.top/2,e.top].map(v=>`<line class="gd" x1="${X0}" y1="${py(v).toFixed(1)}" x2="${X1}" y2="${py(v).toFixed(1)}"/>
    <text class="tk" x="${X0-5}" y="${(py(v)+3).toFixed(1)}" text-anchor="end">${kR(v)}</text>`).join('');
  const pior=dd.reduce((a,b)=>b.total>a.total?b:a);
  return bloco('Já comprometido nos próximos 6 meses',
    `Pior mês: <b>${lblMes(pior.m)}</b> com <b>${R(pior.total)}</b>`,
    `<svg viewBox="0 0 320 138" role="img" aria-label="Comprometido por mês">${gy}${barras}</svg>
     <div class="leg"><div><i style="background:var(--s1)"></i><span class="nm">Parcelas do cartão</span></div>
     <div><i style="background:var(--s2)"></i><span class="nm">Contas fixas</span></div></div>`,
    'Parcela de compra da empresa entra aqui também — o dinheiro sai da sua conta antes do reembolso chegar.');
}

/* 4. entrou contra saiu, 12 meses */
function gAnual(){
  const ms=[]; for(let i=11;i>=0;i--)ms.push(addMes(mes,-i));
  const dd=ms.map(m=>({m,e:soma(receitasMes(m)),s:somaMeu(gastosMes(m))}));
  const topo=Math.max(1,...dd.map(d=>Math.max(d.e,d.s)));
  const e=escala(topo), X0=34,X1=310,Y0=12,Y1=108;
  const banda=(X1-X0)/12, larg=Math.min(9,(banda-4)/2);
  const py=v=>Y1-v/e.top*(Y1-Y0);
  const cols=dd.map((d,i)=>{
    const cx=X0+i*banda+banda/2;
    return `<g ${inf(`${lblMes(d.m)}: entrou ${R(d.e)}, saiu ${R(d.s)} — sobra ${R(d.e-d.s)}`)}>
      <rect x="${(cx-banda/2).toFixed(1)}" y="${Y0}" width="${banda.toFixed(1)}" height="${Y1-Y0}" fill="transparent"/>
      <path d="${col(cx-larg-1,py(d.e),larg,Y1-py(d.e))}" fill="var(--pos)"/>
      <path d="${col(cx+1,py(d.s),larg,Y1-py(d.s))}" fill="var(--neg)"/>
      ${i%2===0?`<text class="tk" x="${cx.toFixed(1)}" y="${Y1+15}" text-anchor="middle">${MESES[+d.m.slice(5)-1]}</text>`:''}</g>`;
  }).join('');
  const gy=[0,e.top/2,e.top].map(v=>`<line class="gd" x1="${X0}" y1="${py(v).toFixed(1)}" x2="${X1}" y2="${py(v).toFixed(1)}"/>
    <text class="tk" x="${X0-4}" y="${(py(v)+3).toFixed(1)}" text-anchor="end">${kR(v)}</text>`).join('');
  const ano=dd.reduce((a,d)=>({e:a.e+d.e,s:a.s+d.s}),{e:0,s:0});
  return bloco('Entrou e saiu — 12 meses',
    `No período: entrou <b>${R(ano.e)}</b>, saiu <b>${R(ano.s)}</b>`,
    `<svg viewBox="0 0 320 130" role="img" aria-label="Entradas e saídas por mês">${gy}${cols}</svg>
     <div class="leg"><div><i style="background:var(--pos)"></i><span class="nm">Entrou</span></div>
     <div><i style="background:var(--neg)"></i><span class="nm">Saiu</span></div></div>`,
    'Compra no cartão conta no mês em que foi feita, não no da fatura. Num rateio, só a sua fatia entra.');
}

const TIPOS_INV=['Poupança','CDB','Tesouro Direto','Fundo','LCI/LCA','Ações/FII','Cripto','Outro'];
function vInvest(){
  const apl=aplicacoes();
  if(!apl.length)return `<div class="c"><div class="empty">Nenhuma aplicação cadastrada.<br>
    <span style="font-size:12px">Cadastre em Ajustes › Aplicações. Depois é só transferir dinheiro para ela.</span></div>
    <button class="b gh" data-ed="invest|">+ Nova aplicação</button></div>`;

  const tot=totalInvestido(), rend=totalRendimento(), apo=tot-rend, h=hoje();
  const pct=apo>0?(rend/apo*100):0;
  const linhas=apl.map(c=>{
    const v=saldo(c.id), r=rendimento(c.id), a=v-r;
    const p=a>0?(r/a*100):0;
    const at=atualizadoEm(c.id), dias=at?diasEntre(at,h):null;
    const velho=dias===null||dias>90;
    return `<div class="row"><div class="l"><div class="t">${esc(c.nome)} <span class="tag k">${esc(c.subtipo||'Outro')}</span></div>
      <div class="sub">${r>=0?'rendeu':'perdeu'} <span class="${r>=0?'pos':'neg'}">${R(Math.abs(r))}</span>${a>0?` · ${p>=0?'+':''}${p.toFixed(1)}%`:''}
        · ${at?`atualizado ${dDia(at)}`:'nunca atualizado'}${velho?' <span class="wnc">⚠</span>':''}</div>
      <div style="margin-top:7px;display:flex;gap:6px;flex-wrap:wrap">
        <button class="s p" data-atual="${c.id}">Atualizar valor</button>
        <button class="s" data-ed="invest|${c.id}">Editar</button></div></div>
      <div class="v">${R(v)}</div></div>`;
  }).join('');

  const fat=apl.map(c=>({nome:c.nome,v:saldo(c.id)})).filter(f=>f.v>0).sort((a,b)=>b.v-a.v);
  const comp=fat.length>1?`<div class="c viz"><h2>Composição da carteira</h2>
    <div class="lida">Aplicado em <b>${fat.length}</b> ${fat.length>1?'lugares':'lugar'}</div>
    ${rosca(fat.slice(0,6),fat.slice(0,6).reduce((s,f)=>s+f.v,0),'da carteira','Composição da carteira')}</div>`:'';

  const velhas=apl.filter(c=>{const a=atualizadoEm(c.id);return !a||diasEntre(a,h)>90});
  return `<div class="c"><h2>Investimentos</h2>
    <div class="big">
      <div><small>Aplicado</small><strong>${R(tot)}</strong></div>
      <div><small>Rendimento</small><strong class="${rend<0?'neg':'pos'}">${rend>=0?'+':'−'}${R(Math.abs(rend))}</strong>
        <div class="sub">${apo>0?`${pct>=0?'+':''}${pct.toFixed(1)}% sobre ${R(apo)} aportados`:'sem aportes registrados'}</div></div>
    </div></div>

  ${velhas.length?`<div class="warn">⚠️ ${velhas.length===1?'Uma aplicação está':`${velhas.length} aplicações estão`} sem atualizar há mais de 3 meses. O valor mostrado é o da última vez que você digitou.</div>`:''}

  <div class="c"><h2>Aplicações</h2>${linhas}
    <button class="b gh" data-ed="invest|">+ Nova aplicação</button>
    <div class="hint">Aportar e resgatar é transferência: vá em Lançar › Transferência e escolha a aplicação.</div></div>
  ${comp}`;
}

/* informar quanto vale hoje; a diferença vira rendimento */
function atualizarValor(id){
  const c=conta(id), atual=saldo(id);
  formModal(`Quanto ${c.nome} vale hoje?`,[
    {k:'valor',label:'Valor atual',type:'money',v:fmt(atual)},
    {k:'data',label:'Data',type:'date',v:hoje()}
  ],d=>{
    const v=parseMoney(d.valor);
    if(v<0)return toast('Valor não pode ser negativo');
    const dif=v-atual;
    if(!dif){fecharMdl();return toast('Valor não mudou')}
    db.lanc.push({id:uid(),tipo:'rend',data:d.data,valor:dif,contaId:id,pago:true,
      desc:(dif>0?'Rendimento ':'Perda ')+c.nome});
    save();fecharMdl();toast(dif>0?`Rendeu ${R(dif)}`:`Perdeu ${R(-dif)}`);render();
  },`Hoje está registrado <b>${R(atual)}</b>. A diferença entra como ${'rendimento'}, sem virar receita do mês.`);
}

/* ============ modal genérico ============ */
let mdlSave=null;
function formModal(titulo,campos,onSave,hint){
  mdlSave=()=>{
    const d={};
    for(const c of campos){
      const el=$(`#mf_${c.k}`);
      d[c.k]=c.type==='check'?el.checked:el.value;
    }
    onSave(d);
  };
  const html=campos.map(c=>{
    const id=`mf_${c.k}`;
    if(c.type==='select')return `<label>${c.label}</label><select id="${id}">${c.opts.map(o=>`<option value="${o.id}" ${o.id===c.v?'selected':''}>${esc(o.nome)}</option>`).join('')}</select>`;
    if(c.type==='check')return `<div class="chk"><input type="checkbox" id="${id}" ${c.v?'checked':''}><span>${c.label}</span></div>`;
    return `<label>${c.label}</label><input id="${id}" type="${c.type==='num'?'number':(c.type==='date'?'date':'text')}" ${c.type==='money'?'inputmode="decimal"':''} ${c.min!=null?`min="${c.min}"`:''} ${c.max!=null?`max="${c.max}"`:''} value="${esc(c.v??'')}" placeholder="${esc(c.ph||'')}">`;
  }).join('');
  $('#mdl').innerHTML=`<div class="mask" data-act="fora"><div class="mdl">
    <h3>${esc(titulo)}</h3>${hint?`<div class="hint">${hint}</div>`:''}${html}
    <button class="b" data-act="mdl-ok">Salvar</button>
    <button class="b gh" data-act="fechar">Cancelar</button></div></div>`;
}
const fecharMdl=()=>{$('#mdl').innerHTML='';mdlSave=null};

/* ---- editores ---- */
function editar(tipo,id){
  if(tipo==='conta'){
    const c=id?conta(id):null;
    formModal(c?'Editar conta':'Nova conta',[
      {k:'nome',label:'Nome',v:c?.nome,ph:'Ex: Nubank'},
      {k:'tipo',label:'Tipo',type:'select',opts:[{id:'dinheiro',nome:'Dinheiro'},{id:'banco',nome:'Banco'}],v:c?.tipo||'banco'},
      {k:'saldoInicial',label:'Saldo inicial',type:'money',v:c?fmt(c.saldoInicial):'0,00'},
      ...(c?[{k:'arq',label:'Arquivada',type:'check',v:c.arq}]:[])
    ],d=>{
      if(!d.nome.trim())return toast('Dê um nome');
      if(c){Object.assign(c,{nome:d.nome,tipo:d.tipo,saldoInicial:parseMoney(d.saldoInicial),arq:!!d.arq})}
      else db.contas.push({id:uid(),nome:d.nome,tipo:d.tipo,saldoInicial:parseMoney(d.saldoInicial),arq:false});
      save();fecharMdl();render();
    });
  }
  if(tipo==='cartao'){
    const c=id?conta(id):null, pg=contasAtivas(false);
    if(!pg.length)return toast('Cadastre uma conta bancária antes');
    formModal(c?'Editar cartão':'Novo cartão',[
      {k:'nome',label:'Nome',v:c?.nome,ph:'Ex: Visa Itaú'},
      {k:'fechamento',label:'Dia do fechamento',type:'num',min:1,max:28,v:c?.fechamento??28},

/* ---- ações em lançamento ---- */
function abrirLanc(id){
  const l=db.lanc.find(x=>x.id===id); if(!l)return;
  const pod=(l.tipo==='saida'||l.tipo==='entrada')&&!isCartao(l.contaId)&&!l.ajuste;
  $('#mdl').innerHTML=`<div class="mask" data-act="fora"><div class="mdl">
    <h3>${esc(l.desc)}</h3>
    <div class="sub">${dDia(l.data)} · ${R(l.valor)} · ${esc(nomeConta(l.contaId))}${l.parcs>1?` · parcela ${l.parc}/${l.parcs}`:''}</div>
    ${l.naoMeu>0?`<div class="hint">Gasto seu: <b>${R(meu(l))}</b> · <b>${esc(nomePessoa(l.devedorId))}</b> deve <b class="empc">${R(l.naoMeu)}</b></div>`:''}
    ${pod?`<button class="b" data-act="pago|${id}">${l.pago?(l.tipo==='saida'?'Desmarcar pago':'Desmarcar recebido'):(l.tipo==='saida'?'Marcar como pago':'Marcar como recebido')}</button>`:''}
    <button class="b gh" data-act="editar-lanc|${id}">Editar</button>
    <button class="b dg" data-act="excluir|${id}">Excluir${l.parcs>1?' compra inteira':''}</button>
    <button class="b gh" data-act="fechar">Fechar</button></div></div>`;
}
function togglePago(id){
  const l=db.lanc.find(x=>x.id===id); if(!l)return;
  if(l.pago){l.pago=false;save();fecharMdl();render();return}
  const f=l.fixaId?db.fixas.find(x=>x.id===l.fixaId):null;
  if(f&&f.estimado){
    formModal('Confirmar valor',[{k:'valor',label:'Valor real pago',type:'money',v:fmt(l.valor)}],d=>{
      const v=parseMoney(d.valor); if(v<=0)return toast('Valor inválido');
      l.valor=v; l.pago=true; f.valor=v;  /* fixa estimada aprende o valor novo */
      save();fecharMdl();render();
    },'É uma conta fixa de valor estimado — o app guarda esse valor para o próximo mês.');
  }else{l.pago=true;save();fecharMdl();render()}
}
function editarLanc(id){
  const l=db.lanc.find(x=>x.id===id); if(!l)return;
  formModal('Editar lançamento',[
    {k:'desc',label:'Descrição',v:l.desc},
    {k:'valor',label:'Valor',type:'money',v:fmt(l.valor)},
    {k:'data',label:'Data',type:'date',v:l.data},
    ...(l.tipo==='transf'||l.tipo==='fatura'||l.tipo==='reemb'?[]:
      [{k:'catId',label:'Categoria',type:'select',opts:db.cats.filter(c=>!c.arq&&c.tipo===l.tipo),v:l.catId}]),
    ...(l.naoMeu>0&&!l.parcs?[{k:'naoMeu',label:`Quanto ${nomePessoa(l.devedorId)} te deve`,type:'money',v:fmt(l.naoMeu)}]:[])
  ],d=>{
    const v=parseMoney(d.valor); if(v<=0)return toast('Valor inválido');
    if(d.naoMeu!==undefined){
      const nm=Math.min(v,parseMoney(d.naoMeu));
      if(l.cred!==l.credTotal&&nm!==l.naoMeu)return toast('Já recebeu parte disso — não dá para mudar o valor devido');
      l.naoMeu=nm; l.cred=nm; l.credTotal=nm;
      if(!nm)l.devedorId=null;
    }
    Object.assign(l,{desc:d.desc||l.desc,valor:v,data:d.data});
    if(d.catId!==undefined)l.catId=d.catId;
    save();fecharMdl();render();
  },l.parcs>1?'Editar uma parcela não mexe nas outras nem no valor devido.':'');
}
function excluir(id){
  const l=db.lanc.find(x=>x.id===id); if(!l)return;
  const grupo=l.compraId?db.lanc.filter(x=>x.compraId===l.compraId):[l];
  if(grupo.some(x=>x.credTotal>0&&x.credTotal>x.cred)&&!confirm('Parte disso já foi recebida de volta. Excluir mesmo assim?'))return;
  if(!confirm(grupo.length>1?`Excluir a compra inteira (${grupo.length} parcelas)?`:'Excluir este lançamento?'))return;
  const ids=new Set(grupo.map(x=>x.id));
  db.lanc=db.lanc.filter(x=>!ids.has(x.id));
  save();fecharMdl();render();
}
function pagarFatura(cid,ref){
  const c=conta(cid), ab=faturaAberto(cid,ref);
  formModal(`Pagar fatura ${lblMes(ref)}`,[
    {k:'contaId',label:'Pagar com',type:'select',opts:contasAtivas(false),v:c.pagaId},
    {k:'data',label:'Data do pagamento',type:'date',v:hoje()}
  ],d=>{
    db.lanc.push({id:uid(),tipo:'fatura',data:d.data,desc:`Fatura ${c.nome} ${lblMes(ref)}`,
      valor:ab,contaId:d.contaId,destId:cid,faturaRef:ref,pago:true});
    save();fecharMdl();toast('Fatura paga');render();

}
function verFatura(cid,ref){
  const it=faturaItens(cid,ref).sort((a,b)=>a.data<b.data?-1:1);
  $('#mdl').innerHTML=`<div class="mask" data-act="fora"><div class="mdl">

/* ---- Google Drive ----
   O ID de cliente NÃO vive no código: o usuário cola nos Ajustes e ele fica no
   localStorage. Assim o repositório pode ser público sem carregar credencial.
   Escopo appdata: pasta escondida exclusiva deste app — ele não enxerga nenhum
   outro arquivo do Drive, mesmo autorizado.
   O token de acesso fica só em memória, nunca é salvo. */
const DRIVE_ESCOPO='https://www.googleapis.com/auth/drive.appdata';
const DRIVE_ARQ='financeiro.json';
let driveToken=null;
const qdo=ms=>new Date(ms).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'});
/* o Google exige origem https (ou localhost); por arquivo local não funciona */
const driveServe=()=>location.protocol==='https:'||location.hostname==='localhost';

function carregarGIS(){
  if(window.google&&google.accounts&&google.accounts.oauth2)return Promise.resolve();
  return new Promise((ok,err)=>{
    const s=document.createElement('script');
    s.src='https://accounts.google.com/gsi/client';
    s.onload=ok;
    s.onerror=()=>err(new Error('sem internet para falar com o Google'));
    document.head.appendChild(s);
  });
}
async function driveAuth(){
  if(!db.driveId)throw new Error('falta o ID de cliente nos Ajustes');
  if(driveToken&&driveToken.exp>Date.now())return driveToken.t;
  await carregarGIS();
  return new Promise((ok,err)=>{
    google.accounts.oauth2.initTokenClient({
      client_id:db.driveId, scope:DRIVE_ESCOPO,
      callback:r=>{
        if(r.error)return err(new Error(r.error));
        driveToken={t:r.access_token,exp:Date.now()+(r.expires_in-60)*1000};
        ok(r.access_token);
      },
      error_callback:e=>err(new Error(e&&e.type==='popup_closed'?'você fechou a janela do Google':'autorização negada'))
    }).requestAccessToken();
  });
}
const driveHead=tk=>({Authorization:'Bearer '+tk});
async function driveJson(r){
  if(!r.ok)throw new Error('o Drive respondeu '+r.status);
  return r.json();
}
async function driveArquivo(tk){
  const q=encodeURIComponent("name='"+DRIVE_ARQ+"'");
  const j=await driveJson(await fetch(
    `https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&fields=files(id,modifiedTime)&q=${q}`,
    {headers:driveHead(tk)}));
  return (j.files&&j.files[0])||null;
}
const driveBaixar=async(tk,id)=>driveJson(await fetch(
  `https://www.googleapis.com/drive/v3/files/${id}?alt=media`,{headers:driveHead(tk)}));
async function driveSubir(tk,id,dados){
  const corpo=new FormData();
  corpo.append('metadata',new Blob([JSON.stringify(
    id?{name:DRIVE_ARQ}:{name:DRIVE_ARQ,parents:['appDataFolder']})],{type:'application/json'}));
  corpo.append('file',new Blob([JSON.stringify(dados)],{type:'application/json'}));
  return driveJson(await fetch(
    `https://www.googleapis.com/upload/drive/v3/files/${id||''}?uploadType=multipart`,
    {method:id?'PATCH':'POST',headers:driveHead(tk),body:corpo}));
}
const resumo=d=>`${d&&d.sync?qdo(d.sync):'sem data'} · ${(d&&d.lanc&&d.lanc.length)||0} lançamentos`;

async function driveSalvar(){
  try{
    toast('Falando com o Drive…');
    const tk=await driveAuth();
    const f=await driveArquivo(tk);
    if(f){
      const remoto=await driveBaixar(tk,f.id).catch(()=>null);
      /* só avisa quando sobrescrever pode custar caro: o Drive está na frente */
      if(remoto&&remoto.sync&&(!db.sync||remoto.sync>db.sync)&&
         !confirm(`A cópia do Drive é MAIS NOVA que a deste aparelho.\n\n`+
                  `Drive: ${resumo(remoto)}\nAqui: ${resumo(db)}\n\n`+
                  `Salvar vai substituir a do Drive. Continuar?`))return toast('Cancelado');
    }
    const carimbo=Date.now();
    await driveSubir(tk,f&&f.id,{...db,sync:carimbo,backup:carimbo});
    db.sync=carimbo; db.backup=carimbo; save();
    toast('Salvo no Drive'); render();
  }catch(e){toast('Não deu: '+e.message)}
}
async function driveCarregar(){
  try{
    toast('Falando com o Drive…');
    const tk=await driveAuth();
    const f=await driveArquivo(tk);
    if(!f)return toast('Ainda não há backup no Drive');
    const d=await driveBaixar(tk,f.id);
    if(!d||!Array.isArray(d.contas))return toast('O arquivo do Drive não parece um backup deste app');
    const velho=d.sync&&db.sync&&d.sync<db.sync;
    if(!confirm(`${velho?'⚠️ A cópia do Drive é MAIS VELHA que a deste aparelho.\n\n':''}`+
                `Isto APAGA os dados deste aparelho e põe os do Drive no lugar.\n\n`+
                `Drive: ${resumo(d)}\nAqui: ${resumo(db)}\n\nContinuar?`))return toast('Cancelado');
    const idLocal=db.driveId;
    db=d;
    for(const k of ['contas','cats','fixas','lanc','pessoas'])if(!Array.isArray(db[k]))db[k]=[];
    if(!db.orc)db.orc={};
    if(!db.driveId)db.driveId=idLocal;   /* não se tranca para fora da própria sincronização */
    migrar(); save(); gerarFixas();
    toast('Carregado do Drive'); tab='inicio'; mes=mesDe(hoje()); render();
  }catch(e){toast('Não deu: '+e.message)}
}
function salvarDriveId(v){
  /* o formato real é 000000000000-xxxxxxxx.apps.googleusercontent.com.
     Colar pela metade é a causa mais comum do "401 invalid_client". */
  const id=(v||'').trim().replace(/\s/g,'');
  if(id&&!/\.apps\.googleusercontent\.com$/.test(id))
    return toast('O ID termina em .apps.googleusercontent.com');
  if(id&&!/^\d{6,}-[a-z0-9]{8,}\.apps\.googleusercontent\.com$/.test(id))
    return toast('Parece incompleto: falta a parte antes do hífen ou depois dele');
  db.driveId=id||null; driveToken=null; save(); render();
  toast(id?'ID guardado neste aparelho':'ID removido');
}

/* ---- backup ---- */
function exportar(){
  db.backup=Date.now(); save();
  const b=new Blob([JSON.stringify(db)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(b);
  a.download=`financeiro-${hoje()}.json`;
  a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  toast('Backup exportado'); render();
}
function importar(file){
  const r=new FileReader();
  r.onload=()=>{
    let d; try{d=JSON.parse(r.result)}catch(e){return toast('Arquivo inválido')}
    if(!d||!Array.isArray(d.contas))return toast('Não parece um backup deste app');
    if(!confirm(`Isso APAGA os dados deste aparelho e coloca os do arquivo (${d.lanc?.length||0} lançamentos). Continuar?`))return;
    db=d; for(const k of ['contas','cats','fixas','lanc'])if(!Array.isArray(db[k]))db[k]=[];
    if(!db.orc)db.orc={};
    save(); toast('Backup importado'); render();
  };
  r.readAsText(file);
}

const VIEWS={inicio:vInicio,lancar:vLancar,extrato:vExtrato,cartoes:vCartoes,
  carteira:vCarteira,orcamento:vOrcamento,relatorio:vRelatorio,config:vConfig};

/* ============ eventos ============ */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-tab],[data-tp],[data-fl],[data-act],[data-lanc],[data-ed],[data-pagfat],[data-vfat],[data-desistir],[data-mes],[data-selp],[data-atual],[data-ir],[data-info]');
  if(!t)return;
  const d=t.dataset;
  /* tocar numa marca do gráfico escreve o valor na linha de leitura do cartão */
  if(d.info!==undefined){
    const l=t.closest('.c')?.querySelector('.lida');
    if(l)l.textContent=d.info;
    return;
  }
  if(d.tab){fecharMdl();tab=d.tab;render();return}
  if(d.tp){novo.tipo=d.tp;novo.catId='';render();return}
  if(d.fl){filtro=d.fl;render();return}
  if(d.mes){mes=d.mes;tab='extrato';render();return}
  if(d.desistir!==undefined&&d.desistir){desistir(d.desistir);return}
  if(d.selp){itensReceber(l=>l.devedorId===d.selp).forEach(l=>sel.add(l.id));render();return}
  if(d.atual){atualizarValor(d.atual);return}
  /* linha do resumo leva até a seção correspondente na mesma tela */
  if(d.ir){
    const alvo=[...document.querySelectorAll('#view .c > h2')]
      .find(h=>h.textContent===(d.ir==='inv'?'Investimentos':'Me devem'));
    alvo?.closest('.c').scrollIntoView({behavior:'smooth',block:'start'});
    return;
  }
  if(d.lanc){abrirLanc(d.lanc);return}
  if(d.ed!==undefined){const[tp,id]=d.ed.split('|');editar(tp,id);return}
  if(d.pagfat){const[c,r]=d.pagfat.split('|');pagarFatura(c,r);return}
  if(d.vfat){const[c,r]=d.vfat.split('|');verFatura(c,r);return}
  const[a,arg]=(d.act||'').split('|');
  switch(a){
    case 'mes-':mes=addMes(mes,-1);render();break;
    case 'mes+':mes=addMes(mes,1);render();break;
    case 'salvar':salvar();break;
    case 'fechar':fecharMdl();break;
    /* clique no fundo escuro fecha; clique dentro da caixa, não.
       não dá para usar stopPropagation aqui: mataria o clique de todo botão do modal */
    case 'fora':if(e.target.classList.contains('mask'))fecharMdl();break;
    case 'mdl-ok':mdlSave&&mdlSave();break;
    case 'pago':togglePago(arg);break;
    case 'editar-lanc':editarLanc(arg);break;
    case 'excluir':excluir(arg);break;
    case 'sel-emp':itensReceber(daEmpresa).forEach(l=>sel.add(l.id));render();break;
    case 'sel-nada':sel.clear();render();break;
    case 'copiar':copiarLista();break;
    case 'reembolso':registrarReembolso();break;
    case 'drive-id':salvarDriveId($('#driveId').value);break;
    case 'drive-salvar':driveSalvar();break;
    case 'drive-carregar':driveCarregar();break;
    case 'export':exportar();break;
    case 'import':$('#fimp').click();break;
    case 'zerar':
      if(confirm('Apagar TUDO deste aparelho? Não tem como voltar atrás sem um backup.')&&
         confirm('Confirma mesmo? Todos os lançamentos serão perdidos.')){
        db=novoDb();save();tab='inicio';render();toast('Zerado');
      }break;
  }
});
document.addEventListener('input',e=>{
  const f=e.target.dataset.f;
  if(f)novo[f]=e.target.type==='checkbox'?e.target.checked:e.target.value;
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset.sel){el.checked?sel.add(el.dataset.sel):sel.delete(el.dataset.sel);render();return}
  if(el.dataset.teto!==undefined){
    const v=parseMoney(el.value);
    if(v>0)db.orc[el.dataset.teto]=v; else delete db.orc[el.dataset.teto];
    save();render();return;
  }
  if(el.id==='fimp'&&el.files[0]){importar(el.files[0]);el.value='';return}
  const f=el.dataset.f;
  if(f){
    novo[f]=el.type==='checkbox'?el.checked:el.value;
    if(el.dataset.r!==undefined)render();
  }
});

if('serviceWorker' in navigator && location.protocol.startsWith('http'))
